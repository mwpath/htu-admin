<footer id="htuFooter" aria-label="사이트 정보">
  <style>
    #htuFooter { --hf-bg: #06261a; --hf-line: rgba(255,255,255,.1); --hf-muted: rgba(255,255,255,.58);
      position: relative; z-index: 2; background: var(--hf-bg); color: #fff;
      font-family: 'Pretendard Variable','Pretendard','Noto Sans KR',system-ui,sans-serif; -webkit-font-smoothing: antialiased; }
    #htuFooter *, #htuFooter *::before, #htuFooter *::after { box-sizing: border-box; }
    #htuFooter[data-empty] { display: none; }
    #htuFooter .hf-wrap { width: min(1440px, calc(100% - 64px)); margin: 0 auto; }
    #htuFooter .hf-top { display: grid; grid-template-columns: minmax(260px, 1.1fr) 2fr; gap: 48px; padding: 72px 0 48px; }
    #htuFooter .hf-logo { display: inline-flex; align-items: center; font-size: 22px; font-weight: 900; letter-spacing: -.02em; color: #fff; text-decoration: none; }
    #htuFooter .hf-logo img { height: 36px; width: auto; display: block; }
    #htuFooter .hf-info { margin: 22px 0 0; padding: 0; list-style: none; display: grid; gap: 7px; font-size: 13.5px; line-height: 1.6; color: var(--hf-muted); }
    #htuFooter .hf-info li { display: flex; flex-wrap: wrap; column-gap: 14px; row-gap: 2px; }
    #htuFooter .hf-info b { color: rgba(255,255,255,.82); font-weight: 600; margin-right: 6px; }
    #htuFooter .hf-info a { color: inherit; text-decoration: none; }
    #htuFooter .hf-extra { white-space: pre-line; }

    #htuFooter .hf-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 28px; }
    #htuFooter .hf-col h4 { margin: 0 0 16px; font-size: 14px; font-weight: 800; letter-spacing: .02em; color: #fff; }
    #htuFooter .hf-col h4 a { color: inherit; text-decoration: none; }
    #htuFooter .hf-col ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    #htuFooter .hf-col a { color: var(--hf-muted); text-decoration: none; font-size: 14px; transition: color .2s ease; }
    #htuFooter .hf-col a:hover { color: #fff; }
    #htuFooter .hf-ext { font-size: .8em; opacity: .7; }

    #htuFooter .hf-mid { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 0; border-top: 1px solid var(--hf-line); }
    #htuFooter .hf-sns { display: flex; gap: 8px; list-style: none; margin: 0; padding: 0; }
    #htuFooter .hf-sns a { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff;
      background: rgba(255,255,255,.07); border: 1px solid var(--hf-line); transition: background .2s ease, transform .2s ease; }
    #htuFooter .hf-sns a:hover { background: rgba(255,255,255,.16); transform: translateY(-2px); }
    #htuFooter .hf-sns svg { width: 18px; height: 18px; display: block; }

    /* 관련 사이트 드롭다운 */
    #htuFooter .hf-related { position: relative; margin-left: auto; }
    #htuFooter .hf-rel-btn { display: inline-flex; align-items: center; justify-content: space-between; gap: 18px; min-width: 220px; height: 44px; padding: 0 18px;
      border-radius: 10px; border: 1px solid var(--hf-line); background: rgba(255,255,255,.05); color: #fff; cursor: pointer;
      font: inherit; font-size: 13px; font-weight: 800; letter-spacing: .08em; }
    #htuFooter .hf-rel-btn i { width: 10px; height: 10px; position: relative; font-style: normal; }
    #htuFooter .hf-rel-btn i::before, #htuFooter .hf-rel-btn i::after { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 1.5px; background: currentColor; transition: transform .25s ease; }
    #htuFooter .hf-rel-btn i::after { transform: rotate(90deg); }
    #htuFooter .hf-related.is-open .hf-rel-btn i::after { transform: rotate(0); }
    #htuFooter .hf-rel-list { position: absolute; right: 0; bottom: calc(100% + 8px); min-width: 100%; max-height: 320px; overflow-y: auto;
      list-style: none; margin: 0; padding: 8px; background: #fff; border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.3);
      opacity: 0; visibility: hidden; transform: translateY(6px); transition: opacity .2s ease, transform .25s ease, visibility .2s; }
    #htuFooter .hf-related.is-open .hf-rel-list { opacity: 1; visibility: visible; transform: none; }
    #htuFooter .hf-rel-list a { display: flex; justify-content: space-between; gap: 14px; padding: 10px 12px; border-radius: 8px; color: #0b1220;
      text-decoration: none; font-size: 14px; font-weight: 600; white-space: nowrap; }
    #htuFooter .hf-rel-list a:hover { background: #eef5f2; color: #0a6a62; }

    #htuFooter .hf-bot { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 0 34px; border-top: 1px solid var(--hf-line);
      font-size: 12.5px; color: var(--hf-muted); }
    #htuFooter .hf-policy { display: flex; flex-wrap: wrap; gap: 4px 18px; list-style: none; margin: 0; padding: 0; }
    #htuFooter .hf-policy a { color: rgba(255,255,255,.85); text-decoration: none; font-weight: 700; }
    #htuFooter .hf-policy li:first-child a { color: #7fd3b8; }

    @media (max-width: 900px) {
      #htuFooter .hf-wrap { width: calc(100% - 40px); }
      #htuFooter .hf-top { grid-template-columns: 1fr; gap: 36px; padding: 52px 0 36px; }
      #htuFooter .hf-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #htuFooter .hf-mid { flex-direction: column; align-items: stretch; }
      #htuFooter .hf-related { margin-left: 0; }
      #htuFooter .hf-rel-btn { width: 100%; }
      #htuFooter .hf-bot { flex-direction: column-reverse; align-items: flex-start; }
    }
  </style>

  <div class="hf-wrap">
    <div class="hf-top">
      <div class="hf-brand">
        <a class="hf-logo" href="./index.html"></a>
        <ul class="hf-info"></ul>
      </div>
      <div class="hf-cols"></div>
    </div>
    <div class="hf-mid">
      <ul class="hf-sns"></ul>
      <div class="hf-related"></div>
    </div>
    <div class="hf-bot">
      <div class="hf-copy"></div>
      <ul class="hf-policy"></ul>
    </div>
  </div>

  <script>
    (function () {
      var F = document.getElementById('htuFooter');
      if (!F || F.__htuInit) return;
      F.__htuInit = true;

      function htuCms() {
        if (window.__HTU_CMS_DATA__) return Promise.resolve(window.__HTU_CMS_DATA__);
        if (!window.__htuCmsP) {
          var ep = String(window.HTU_CMS_ENDPOINT || '').replace(/\/+$/, '') + '/api/public/content';
          window.__htuCmsP = fetch(ep, { credentials: 'omit' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
        }
        return window.__htuCmsP;
      }
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function attrs(it) {
        var a = ' href="' + esc(it.url || '#') + '"';
        if (it.new_tab) a += ' target="_blank" rel="noopener noreferrer"';
        return a;
      }
      var EXT = ' <span class="hf-ext" aria-hidden="true">↗</span>';
      var ICON = {
        youtube: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12 31 31 0 0 0 1 16.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1c.4-1.6.5-3.2.5-4.8s-.1-3.2-.5-4.8ZM9.8 15.1V8.9L15.6 12l-5.8 3.1Z"/></svg>',
        instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
        blog: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 3h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-6l-2 3-2-3H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Zm3.5 4v6h2.6c1.3 0 2.1-.7 2.1-1.7 0-.7-.4-1.2-1-1.4.5-.2.8-.7.8-1.2C12 7.6 11.3 7 10 7H7.5Zm1.4 1.1h1c.5 0 .8.2.8.6s-.3.6-.8.6h-1V8.1Zm0 2.2h1.1c.6 0 .9.3.9.7s-.3.7-.9.7H8.9v-1.4ZM13.2 7v6h1.4V7h-1.4Zm2.5 2.6v3.4h1.4V9.6h-1.4Zm.7-2.3a.8.8 0 1 0 0 1.6.8.8 0 0 0 0-1.6Z"/></svg>',
        facebook: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.5H16l.4-3h-2.9V8.6c0-.9.3-1.5 1.5-1.5h1.5V4.4c-.3 0-1.2-.1-2.2-.1-2.2 0-3.7 1.3-3.7 3.8v2.4H8v3h2.6V21h2.9Z"/></svg>',
        kakao: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5c-5 0-9 3.1-9 7 0 2.5 1.7 4.7 4.2 5.9l-.9 3.4c-.1.3.3.6.6.4l4-2.6h1.1c5 0 9-3.1 9-7s-4-7.1-9-7.1Z"/></svg>',
        x: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.8 3h3.1l-6.8 7.7 8 10.3h-6.2l-4.9-6.3L5.4 21H2.3l7.2-8.3L1.8 3h6.4l4.4 5.8L17.8 3Zm-1.1 16.2h1.7L7.4 4.7H5.5l11.2 14.5Z"/></svg>',
        linkedin: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9.5h4V21H3V9.5Zm7 0h3.8v1.6h.1c.5-1 1.8-2 3.8-2 4 0 4.8 2.6 4.8 6V21h-4v-5.2c0-1.2 0-2.9-1.8-2.9s-2 1.4-2 2.8V21h-4V9.5Z"/></svg>',
        tiktok: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 3c.4 2 1.6 3.4 3.6 3.7v3.1a7 7 0 0 1-3.6-1.1v6.6A6.3 6.3 0 1 1 10.3 9v3.2a3.1 3.1 0 1 0 3.1 3.1V3h3.2Z"/></svg>',
        link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>'
      };

      htuCms().then(function (data) {
        data = data || {};
        var st = (data.settings && data.settings.footer) || {};
        var m = data.menus || {};

        F.querySelector('.hf-logo').innerHTML = st.logo_url
          ? '<img src="' + esc(st.logo_url) + '" alt="' + esc(st.logo_text || 'HTU GLOBAL') + '">'
          : esc(st.logo_text || 'HTU GLOBAL HOLDINGS');

        /* 회사 정보 */
        var row = function (pairs) {
          var html = pairs.filter(function (p) { return p[1]; }).map(function (p) {
            var v = esc(p[1]);
            if (p[2] === 'tel') v = '<a href="tel:' + esc(String(p[1]).replace(/[^0-9+]/g, '')) + '">' + v + '</a>';
            if (p[2] === 'mail') v = '<a href="mailto:' + esc(p[1]) + '">' + v + '</a>';
            return '<span><b>' + p[0] + '</b>' + v + '</span>';
          }).join('');
          return html ? '<li>' + html + '</li>' : '';
        };
        F.querySelector('.hf-info').innerHTML =
          row([['상호', st.company], ['대표', st.ceo]]) +
          row([['주소', st.address]]) +
          row([['사업자등록번호', st.biz_no]]) +
          row([['TEL', st.tel, 'tel'], ['FAX', st.fax], ['E-mail', st.email, 'mail']]) +
          (st.extra ? '<li class="hf-extra">' + esc(st.extra) + '</li>' : '');

        /* 메뉴 컬럼 */
        F.querySelector('.hf-cols').innerHTML = (m.footer || []).map(function (col) {
          var head = col.url ? '<a' + attrs(col) + '>' + esc(col.label) + (col.external ? EXT : '') + '</a>' : esc(col.label);
          return '<div class="hf-col"><h4>' + head + '</h4><ul>' + (col.children || []).map(function (c) {
            return '<li><a' + attrs(c) + '>' + esc(c.label) + (c.external ? EXT : '') + '</a></li>';
          }).join('') + '</ul></div>';
        }).join('');

        /* SNS */
        F.querySelector('.hf-sns').innerHTML = (m.sns || []).filter(function (s) { return s.url; }).map(function (s) {
          return '<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer" aria-label="' + esc(s.label) + '" title="' + esc(s.label) + '">' + (ICON[s.icon] || ICON.link) + '</a></li>';
        }).join('');

        /* 관련 사이트 */
        var rel = (m.related || []).filter(function (r) { return r.url; });
        var relBox = F.querySelector('.hf-related');
        if (rel.length) {
          relBox.innerHTML = '<button type="button" class="hf-rel-btn" aria-expanded="false">' + esc(st.related_label || 'FAMILY SITE') + '<i aria-hidden="true"></i></button>' +
            '<ul class="hf-rel-list">' + rel.map(function (r) {
              return '<li><a' + attrs(r) + '><span>' + esc(r.label) + '</span>' + (r.external ? '<span aria-hidden="true">↗</span>' : '') + '</a></li>';
            }).join('') + '</ul>';
          var btn = relBox.querySelector('.hf-rel-btn');
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            var open = !relBox.classList.contains('is-open');
            relBox.classList.toggle('is-open', open);
            btn.setAttribute('aria-expanded', open ? 'true' : 'false');
          });
          document.addEventListener('click', function (e) { if (!relBox.contains(e.target)) relBox.classList.remove('is-open'); });
        }

        F.querySelector('.hf-policy').innerHTML = (m.policy || []).map(function (p) {
          return '<li><a' + attrs(p) + '>' + esc(p.label) + '</a></li>';
        }).join('');
        F.querySelector('.hf-copy').textContent = st.copyright || '';
      });
    })();
  </script>
</footer>
