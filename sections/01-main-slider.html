<section id="mainSliderPack" aria-label="Main Slider Pack">
  <style>/*@include css/main-slider.css*/</style>
  <style>
    /* ===== CMS 추가 스타일 (mainSliderPack 스코프) ===== */
    #mainSliderPack .family-site-card.is-soon { cursor: default; }
    #mainSliderPack .family-site-card.is-soon:hover { transform: none; }
    #mainSliderPack .family-site-card.is-soon .family-site-arrow { opacity: .45; }
    #mainSliderPack .family-site-note:empty { display: none; }
    #mainSliderPack .main-slider-section2[data-empty] { display: none; }
  </style>

  <section id="main-slider-root">
    <div class="main-slider-section1 fade-target">
      <dl>
        <dt data-cms="intro-title"></dt>
        <dd data-cms="intro-body"></dd>
      </dl>
    </div>

    <div class="main-slider-section2">
      <div class="main-slider-bg"></div>
      <ul class="main-slider-list fade-target"></ul>
    </div>
  </section>

  <div id="permanent-bg-layer" style="filter:brightness(0.5);">
    <img src="" alt="영구 배경">
  </div>

  <div class="family-site-modal" id="familySiteModal" aria-hidden="true">
    <div class="family-site-backdrop" data-close-family-site></div>
    <div class="family-site-dialog" role="dialog" aria-modal="true" aria-labelledby="familySiteModalTitle">
      <div class="family-site-shell">
        <aside class="family-site-side">
          <span class="family-site-eyebrow" id="familySiteEyebrow"></span>
          <h2 class="family-site-title" id="familySiteModalTitle">패밀리 사이트</h2>
          <p class="family-site-desc" id="familySiteDesc"></p>
          <div class="family-site-meta" id="familySiteMeta"></div>
        </aside>
        <div class="family-site-main">
          <div class="family-site-toolbar">
            <div class="family-site-toolbar-left">
              <h3 id="familySiteToolbarTitle">관련 사이트 리스트</h3>
              <p id="familySiteToolbarDesc">원하시는 플랫폼을 선택하면 새 창에서 이동합니다.</p>
            </div>
            <button type="button" class="family-site-close" aria-label="패밀리 사이트 팝업 닫기" data-close-family-site>&times;</button>
          </div>
          <div class="family-site-grid" id="familySiteGrid"></div>
          <div class="family-site-note" id="familySiteNote"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    ; (function () {
      var pack = document.getElementById('mainSliderPack');
      if (!pack || pack.__htuInit) return;
      pack.__htuInit = true;

      /* ---------- CMS 데이터 로더 (섹션 공통, 멱등) ---------- */
      function htuCms() {
        if (window.__HTU_CMS_DATA__) return Promise.resolve(window.__HTU_CMS_DATA__);
        if (!window.__htuCmsP) {
          var ep = String(window.HTU_CMS_ENDPOINT || '').replace(/\/+$/, '') + '/api/public/content';
          window.__htuCmsP = fetch(ep, { credentials: 'omit' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        }
        return window.__htuCmsP;
      }
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      htuCms().then(function (data) {
        data = data || {};
        var settings = (data.settings && data.settings.hero) || {};
        var slidesData = data.heroSlides || [];
        var groups = data.familyGroups || {};
        renderHero(settings, slidesData);
        initSlider();
        initFamily(groups);
      });

      /* ---------- 렌더 ---------- */
      function renderHero(st, slidesData) {
        var root = document.getElementById('main-slider-root');
        var dt = root.querySelector('[data-cms="intro-title"]');
        var dd = root.querySelector('[data-cms="intro-body"]');
        if (dt) dt.innerHTML = st.intro_title_html || '';
        if (dd) dd.innerHTML = st.intro_body_html || '';

        var s2 = root.querySelector('.main-slider-section2');
        var bg = root.querySelector('.main-slider-bg');
        var list = root.querySelector('.main-slider-list');
        if (!slidesData.length) { s2.setAttribute('data-empty', ''); return; }

        s2.style.height = (slidesData.length * 100) + 'vh';

        bg.innerHTML = slidesData.map(function (s, i) {
          return '<img src="' + esc(s.image_url) + '" alt="' + esc(s.title_text || '') + '"' + (i === 0 ? ' class="active"' : '') + '>';
        }).join('');

        list.innerHTML = slidesData.map(function (s) {
          var html = '<li><div class="slide-text">';
          if (s.title_html) html += '<h4>' + s.title_html + '</h4>';
          if (s.body_html) html += '<p>' + s.body_html + '</p>';
          if (s.link_url && s.link_label) {
            html += '<a href="' + esc(s.link_url) + '"' + (s.link_new_tab ? ' target="_blank" rel="noopener noreferrer"' : '') + '>' + esc(s.link_label) + ' ></a><br>';
          }
          if (s.family_key) {
            html += '<button type="button" class="main-slider-link family-site-open" data-family-key="' + esc(s.family_key) + '">' + esc(s.family_label || '패밀리사이트') + ' ></button>';
          }
          return html + '</div></li>';
        }).join('');

        var last = slidesData[slidesData.length - 1];
        var permImg = document.querySelector('#permanent-bg-layer img');
        if (permImg && last) permImg.src = last.image_url || '';
      }

      /* ---------- 슬라이더 (원본 로직 유지) ---------- */
      function initSlider() {
        var root = document.getElementById('main-slider-root');
        var permanentBgLayer = document.getElementById('permanent-bg-layer');
        if (!root) return;

        var s1 = root.querySelector('.main-slider-section1');
        var s2 = root.querySelector('.main-slider-section2');
        var bgImgs = root.querySelectorAll('.main-slider-bg img');
        var slides = root.querySelectorAll('.main-slider-list li');
        var texts = root.querySelectorAll('.slide-text');
        var fades = [].slice.call(root.querySelectorAll('.fade-target'));
        var total = slides.length;
        if (!total) return;

        var lastSlideReached = false;
        var permanentBackgroundActive = false;
        var prevScrollY = 0;

        var MAX_Y = 40, FADE_START = .65, FADE_END = 0, SCALE_MIN = .86, SCALE_MAX = 1;
        var curScale = SCALE_MIN, trgScale = SCALE_MIN, rafId = null, active = false;
        var states = Array.from({ length: total }, function () { return { op: 1, y: MAX_Y }; });

        function initializeImages() {
          bgImgs.forEach(function (img, i) {
            img.classList.remove('active');
            img.classList.remove('permanent-active');
            if (i === 0) {
              img.classList.add('active');
              img.style.transform = 'scale(' + curScale + ')';
            }
          });
        }

        initializeImages();
        slides[0].classList.add('active');
        permanentBgLayer.classList.remove('active');
        permanentBgLayer.classList.remove('permanent');

        var lerp = function (a, b, t) { return a + (b - a) * t; };
        var vh = function () { return innerHeight; };

        function animate() {
          curScale = lerp(curScale, trgScale, .18);
          bgImgs.forEach(function (img) {
            if (img.classList.contains('active') || img.classList.contains('permanent-active')) {
              img.style.transform = 'scale(' + curScale + ')';
            }
          });
          texts.forEach(function (el, i) {
            var st = states[i];
            el.style.opacity = lerp(+el.style.opacity || 1, st.op, .25);
            var prev = +el.style.getPropertyValue('--ty') || 0;
            var ny = lerp(prev, st.y, .2);
            el.style.transform = 'translateY(' + ny + 'px)';
            el.style.setProperty('--ty', ny);
          });
          rafId = requestAnimationFrame(animate);
        }

        function updateStates() {
          var viewH = vh(), y = scrollY;
          var scrollDirection = y > prevScrollY ? 'down' : 'up';
          prevScrollY = y;

          var s2Top = root.offsetTop + s2.offsetTop;
          var start = s2Top - viewH;
          var end = s2Top + viewH * .25;

          trgScale = (y < start) ? SCALE_MIN : (y > end) ? SCALE_MAX
            : SCALE_MIN + (SCALE_MAX - SCALE_MIN) * ((y - start) / (end - start));

          var rootRect = root.getBoundingClientRect();
          if (rootRect.top < viewH && rootRect.bottom > 0) {
            var idx = Math.min(total - 1, Math.max(0, Math.floor((y - s2Top + viewH / 2) / viewH)));

            if (idx === total - 1) {
              if (!lastSlideReached) {
                lastSlideReached = true;
                permanentBackgroundActive = true;
                permanentBgLayer.classList.add('active');
                permanentBgLayer.classList.add('permanent');
              }
            } else if (scrollDirection === 'up' && lastSlideReached) {
              lastSlideReached = false;
              permanentBackgroundActive = false;
              permanentBgLayer.classList.remove('active');
              permanentBgLayer.classList.remove('permanent');
            }

            slides.forEach(function (li, i) { li.classList.toggle('active', i === idx); });

            if (!permanentBackgroundActive) {
              bgImgs.forEach(function (img, i) {
                img.classList.toggle('active', i === idx);
                img.classList.remove('permanent-active');
              });
            } else if (idx === total - 1) {
              bgImgs.forEach(function (img, i) {
                img.classList.remove('active');
                if (i === total - 1) img.classList.add('permanent-active');
              });
            } else if (scrollDirection === 'up') {
              bgImgs.forEach(function (img, i) {
                img.classList.toggle('active', i === idx);
                img.classList.remove('permanent-active');
              });
            } else {
              bgImgs.forEach(function (img, i) {
                if (i === total - 1) img.classList.add('permanent-active');
                else img.classList.remove('active');
              });
            }
          }

          var totalHeight = root.offsetHeight;
          var scrollProgress = (y + viewH) - root.offsetTop;
          var endThreshold = totalHeight - viewH * 0.3;

          if (scrollProgress >= endThreshold && scrollDirection === 'down' && !permanentBackgroundActive) {
            permanentBackgroundActive = true;
            permanentBgLayer.classList.add('permanent');
            bgImgs.forEach(function (img, i) {
              if (i === total - 1) img.classList.add('permanent-active');
            });
          }

          texts.forEach(function (_, i) {
            var center = s2Top + viewH * i + viewH / 2;
            var dist = ((y + viewH / 2) - center) / viewH;
            if (dist < -FADE_START) states[i] = { op: 0, y: MAX_Y };
            else if (dist < -FADE_END) {
              var p = (dist + FADE_START) / (FADE_START - FADE_END);
              states[i] = { op: p, y: MAX_Y * (1 - p) };
            } else states[i] = { op: 1, y: 0 };
          });

          root.classList.toggle('s1-out', s1.getBoundingClientRect().bottom < viewH / 2);
        }

        function setActive(on) {
          if (on === active) return;
          active = on;
          root.classList.toggle('inview', on);
          if (on) {
            addEventListener('scroll', updateStates, { passive: true });
            addEventListener('resize', updateStates);
            updateStates();
            rafId = requestAnimationFrame(animate);
          } else {
            removeEventListener('scroll', updateStates);
            removeEventListener('resize', updateStates);
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
          }
        }

        function applyFade(rect, viewH) {
          var START_LINE = viewH;
          var SPAN = viewH * 0.7;
          var dist = START_LINE - rect.bottom;
          var ratio = dist <= 0 ? 0 : Math.min(0.7, dist / SPAN);
          fades.forEach(function (el) {
            if (permanentBackgroundActive && el.closest('#permanent-bg-layer')) return;
            el.style.opacity = Math.max(0, 1 - ratio);
          });
        }

        function checkPos() {
          var r = root.getBoundingClientRect();
          var v = vh();
          setActive((r.top <= 0) && (r.bottom > 0));
          root.classList.toggle('clip', r.bottom <= v * 0.8);
          applyFade(r, v);
        }

        addEventListener('scroll', checkPos, { passive: true });
        addEventListener('resize', checkPos);
        window.addEventListener('load', checkPos);
        initializeImages();
        checkPos();
      }

      /* ---------- 패밀리사이트 팝업 ---------- */
      function initFamily(familySiteData) {
        var modal = document.getElementById('familySiteModal');
        if (!modal) return;
        var openButtons = pack.querySelectorAll('.family-site-open');
        var closeButtons = modal.querySelectorAll('[data-close-family-site]');
        var eyebrowEl = document.getElementById('familySiteEyebrow');
        var titleEl = document.getElementById('familySiteModalTitle');
        var descEl = document.getElementById('familySiteDesc');
        var metaEl = document.getElementById('familySiteMeta');
        var toolbarTitleEl = document.getElementById('familySiteToolbarTitle');
        var toolbarDescEl = document.getElementById('familySiteToolbarDesc');
        var gridEl = document.getElementById('familySiteGrid');
        var noteEl = document.getElementById('familySiteNote');
        var lastFocusedElement = null;
        var scrollLockY = 0;
        var keys = Object.keys(familySiteData);

        function createMetaHTML(items) {
          return (items || []).map(function (item) {
            return '<div class="family-site-meta-item"><span>●</span><span>' + esc(item) + '</span></div>';
          }).join('');
        }

        function createCardHTML(site) {
          var soon = !site.href || site.href === '#';
          var arrow = site.external ? '↗' : '→';
          var inner =
            '<div class="family-site-card-top">' +
              '<span class="family-site-badge">' + esc(site.badge || '패밀리 사이트') + '</span>' +
              '<span class="family-site-arrow">' + arrow + '</span>' +
            '</div>' +
            '<h4>' + esc(site.title) + '</h4>' +
            '<p>' + esc(site.desc) + '</p>' +
            '<span class="family-site-url">' + esc(site.urlText) + '</span>';
          if (soon) return '<div class="family-site-card is-soon" aria-disabled="true">' + inner + '</div>';
          var target = site.external ? ' target="_blank" rel="noopener noreferrer"' : '';
          return '<a href="' + esc(site.href) + '" class="family-site-card"' + target + '>' + inner + '</a>';
        }

        function renderFamilySiteContent(key) {
          var data = familySiteData[key] || familySiteData[keys[0]];
          if (!data) return;
          if (eyebrowEl) eyebrowEl.textContent = data.eyebrow || '';
          if (titleEl) titleEl.textContent = data.title || '';
          if (descEl) descEl.textContent = data.desc || '';
          if (toolbarTitleEl) toolbarTitleEl.textContent = data.toolbarTitle || '';
          if (toolbarDescEl) toolbarDescEl.textContent = data.toolbarDesc || '';
          if (noteEl) noteEl.textContent = data.note || '';
          if (metaEl) metaEl.innerHTML = createMetaHTML(data.meta);
          if (gridEl) gridEl.innerHTML = (data.sites || []).map(createCardHTML).join('');
        }

        function openFamilySiteModal(key) {
          renderFamilySiteContent(key);
          lastFocusedElement = document.activeElement;
          scrollLockY = window.scrollY || window.pageYOffset || 0;
          document.body.style.position = 'fixed';
          document.body.style.top = '-' + scrollLockY + 'px';
          document.body.style.left = '0';
          document.body.style.right = '0';
          document.body.style.width = '100%';
          modal.classList.add('is-open');
          modal.setAttribute('aria-hidden', 'false');
          document.body.classList.add('family-site-modal-open');
          requestAnimationFrame(function () {
            var scrollArea = modal.querySelector('.family-site-main');
            if (scrollArea) scrollArea.scrollTop = 0;
          });
        }

        function closeFamilySiteModal() {
          modal.classList.remove('is-open');
          modal.setAttribute('aria-hidden', 'true');
          document.body.classList.remove('family-site-modal-open');
          document.body.style.position = '';
          document.body.style.top = '';
          document.body.style.left = '';
          document.body.style.right = '';
          document.body.style.width = '';
          window.scrollTo(0, scrollLockY);
          if (lastFocusedElement) lastFocusedElement.focus();
        }

        openButtons.forEach(function (button) {
          button.addEventListener('click', function (e) {
            e.preventDefault();
            openFamilySiteModal(button.getAttribute('data-family-key'));
          });
        });
        closeButtons.forEach(function (button) { button.addEventListener('click', closeFamilySiteModal); });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && modal.classList.contains('is-open')) closeFamilySiteModal();
        });
      }
    })();
  </script>
</section>
