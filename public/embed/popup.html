<!--
  [HTU CMS 섹션] popup.html
  다른 사이트(아임웹/카페24/정적 HTML 등)에 붙여넣을 때는 이 섹션들보다 위쪽에 아래 한 줄을 1회만 넣어주세요.
  <script>window.HTU_CMS_ENDPOINT = 'https://관리자-배포-도메인';</script>
  내용 수정은 관리자 페이지(/admin)에서 하면 자동 반영됩니다.
-->
<section id="medicalPopupNoticeSection" class="mps-hidden" aria-label="이미지 팝업 섹션">
  <style>
    #medicalPopupNoticeSection{
      --mps-ease:cubic-bezier(.22,1,.36,1);

      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      overflow:auto;
      isolation:isolate;
      z-index:99999;
      font-family:"Pretendard","Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      box-sizing:border-box;
    }

    #medicalPopupNoticeSection *,
    #medicalPopupNoticeSection *::before,
    #medicalPopupNoticeSection *::after{
      box-sizing:border-box;
    }

    #medicalPopupNoticeSection .mps-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.58);
      pointer-events:auto;
      opacity:0;
      animation:mps_backdropIn .5s var(--mps-ease) forwards;
    }

    #medicalPopupNoticeSection .mps-overlay{
      position:relative;
      width:100%;
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      padding:24px 24px 24px 48px;
      pointer-events:none;
    }

    #medicalPopupNoticeSection .mps-dialog{
      pointer-events:auto;
      animation:mps_fadeInUp .7s var(--mps-ease) both;
      background:transparent;
      border:0;
      border-radius:0;
      box-shadow:none;
      overflow:visible;
      display:block;
      margin:0;
    }

    #medicalPopupNoticeSection .mps-topbar{
      display:none;
    }

    #medicalPopupNoticeSection .mps-slider-wrap{
      overflow:hidden;
      touch-action:pan-y pinch-zoom;
      cursor:default;
      display:block;
      margin:0;
      padding:0;
      line-height:0;
    }

    #medicalPopupNoticeSection .mps-track{
      display:flex;
      gap:0;
      transition:transform .5s var(--mps-ease);
      will-change:transform;
      margin:0;
      padding:0;
    }

    #medicalPopupNoticeSection .mps-track.is-dragging{
      transition:none;
      cursor:grabbing;
    }

    #medicalPopupNoticeSection .mps-slider-wrap.is-dragging{
      cursor:grabbing;
    }

    #medicalPopupNoticeSection .mps-track img{
      -webkit-user-drag:none;
      user-select:none;
      pointer-events:none;
    }

    #medicalPopupNoticeSection .mps-card{
      flex:0 0 100%;
      min-width:0;
      overflow:visible;
      background:transparent;
      transform:translateY(10px);
      opacity:0;
      animation:mps_fadeInUp .6s var(--mps-ease) forwards;
      margin:0;
      padding:0;
      line-height:0;
      display:flex;
      justify-content:flex-start;
      align-items:flex-start;
    }

    #medicalPopupNoticeSection .mps-card-frame{
      overflow:hidden;
      display:block;
      line-height:0;
      margin:0;
      padding:0;
    }

    #medicalPopupNoticeSection .mps-card-link{
      display:block;
      width:100%;
      text-decoration:none;
      margin:0;
      padding:0;
      line-height:0;
      overflow:hidden;
    }

    #medicalPopupNoticeSection .mps-card-image{
      display:block;
      width:100%;
      height:auto;
      background:transparent;
      margin:0;
      padding:0;
      border:0;
    }

    #medicalPopupNoticeSection .mps-footer{
      width:100%;
      margin:0;
      padding:0 18px;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      color:#fff;
      line-height:1;
      box-sizing:border-box;
    }

    #medicalPopupNoticeSection .mps-footer-left,
    #medicalPopupNoticeSection .mps-footer-right{
      flex:0 0 auto;
      display:flex;
      align-items:center;
      line-height:1;
    }

    #medicalPopupNoticeSection .mps-footer-center{
      flex:1 1 auto;
      min-width:0;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      font-size:13px;
      font-weight:800;
      letter-spacing:-0.04em;
      line-height:1.2;
      padding:0 6px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    #medicalPopupNoticeSection .mps-hide-btn,
    #medicalPopupNoticeSection .mps-close-btn{
      border:0;
      background:transparent;
      color:inherit;
      padding:8px 0;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-weight:600;
      letter-spacing:-.04em;
      transition:opacity .24s ease, transform .24s var(--mps-ease);
      appearance:none;
      -webkit-appearance:none;
      outline:none;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      white-space:nowrap;
    }

    #medicalPopupNoticeSection .mps-hide-btn:hover,
    #medicalPopupNoticeSection .mps-close-btn:hover{
      opacity:.86;
      transform:translateY(-1px);
    }

    #medicalPopupNoticeSection .mps-hide-btn{
      font-size:13px;
    }

    #medicalPopupNoticeSection .mps-close-btn{
      font-size:0;
      gap:0;
    }

    #medicalPopupNoticeSection .mps-check-circle{
      width:20px;
      height:20px;
      flex:0 0 20px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    #medicalPopupNoticeSection .mps-check-circle svg{
      width:100%;
      height:100%;
      display:block;
      overflow:visible;
    }

    #medicalPopupNoticeSection .mps-check-circle .ck-ring{
      fill:none;
      stroke:rgba(255,255,255,.75);
      stroke-width:2;
      transition:stroke .28s var(--mps-ease), fill .28s var(--mps-ease);
    }

    #medicalPopupNoticeSection .mps-check-circle .ck-mark{
      fill:none;
      stroke:rgba(255,255,255,.35);
      stroke-width:2.2;
      stroke-linecap:round;
      stroke-linejoin:round;
      stroke-dasharray:18;
      stroke-dashoffset:18;
      transition:stroke-dashoffset .36s var(--mps-ease), stroke .28s var(--mps-ease);
    }

    #medicalPopupNoticeSection .mps-hide-btn.is-checked .ck-ring{
      fill:#fff;
      stroke:#fff;
    }

    #medicalPopupNoticeSection .mps-hide-btn.is-checked .ck-mark{
      stroke:#111;
      stroke-dashoffset:0;
    }

    #medicalPopupNoticeSection .mps-hide-label{
      display:inline-flex;
      align-items:center;
      line-height:1.1;
    }

    #medicalPopupNoticeSection .mps-close-icon{
      width:24px;
      height:24px;
      position:relative;
      flex:0 0 auto;
      color:#fff;
    }

    #medicalPopupNoticeSection .mps-close-icon::before,
    #medicalPopupNoticeSection .mps-close-icon::after{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      width:26px;
      height:2px;
      background:currentColor;
      border-radius:999px;
      transform-origin:center;
    }

    #medicalPopupNoticeSection .mps-close-icon::before{
      transform:translate(-50%,-50%) rotate(45deg);
    }

    #medicalPopupNoticeSection .mps-close-icon::after{
      transform:translate(-50%,-50%) rotate(-45deg);
    }

    #medicalPopupNoticeSection.mps-hidden{
      display:none !important;
    }

    #medicalPopupNoticeSection.mps-closing .mps-backdrop{
      animation:mps_backdropOut .36s var(--mps-ease) forwards;
    }

    #medicalPopupNoticeSection.mps-closing .mps-dialog{
      animation:mps_fadeOutDown .36s var(--mps-ease) forwards;
    }

    @keyframes mps_fadeInUp{
      from{opacity:0;transform:translateY(26px);}
      to{opacity:1;transform:translateY(0);}
    }

    @keyframes mps_fadeOutDown{
      from{opacity:1;transform:translateY(0);}
      to{opacity:0;transform:translateY(30px);}
    }

    @keyframes mps_backdropIn{
      from{opacity:0;}
      to{opacity:1;}
    }

    @keyframes mps_backdropOut{
      from{opacity:1;}
      to{opacity:0;}
    }

    /* 모바일 overlay 중앙 정렬 */
    @media (max-width: 860px){
      #medicalPopupNoticeSection .mps-overlay{
        padding:20px;
        align-items:center;
        justify-content:center;
      }
      #medicalPopupNoticeSection .mps-card{
        justify-content:center;
      }
      #medicalPopupNoticeSection .mps-footer{
        padding:0 10px;
        gap:8px;
      }
      #medicalPopupNoticeSection .mps-hide-btn{
        font-size:11px;
        gap:6px;
        padding:6px 0;
      }
      #medicalPopupNoticeSection .mps-check-circle{
        width:16px;
        height:16px;
        flex-basis:16px;
      }
      #medicalPopupNoticeSection .mps-close-btn{
        padding:6px 0 6px 6px;
      }
      #medicalPopupNoticeSection .mps-close-icon{
        width:18px;
        height:18px;
      }
      #medicalPopupNoticeSection .mps-close-icon::before,
      #medicalPopupNoticeSection .mps-close-icon::after{
        width:18px;
      }
    }

    @media (max-width: 420px){
      #medicalPopupNoticeSection .mps-footer{
        padding:0 8px;
        gap:6px;
      }
      #medicalPopupNoticeSection .mps-hide-btn{
        font-size:10px;
        gap:5px;
      }
      #medicalPopupNoticeSection .mps-close-icon{
        width:16px;
        height:16px;
      }
      #medicalPopupNoticeSection .mps-close-icon::before,
      #medicalPopupNoticeSection .mps-close-icon::after{
        width:16px;
      }
    }

    /* ===== CMS 추가 ===== */
    #medicalPopupNoticeSection[data-align="center"] .mps-overlay { justify-content: center; padding: 24px; }
    #medicalPopupNoticeSection[data-align="center"] .mps-card { justify-content: center; }
    #medicalPopupNoticeSection .mps-footer-center { color: rgba(255,255,255,.72); font-weight: 700; font-size: 12px; letter-spacing: .04em; }
    #medicalPopupNoticeSection .mps-footer-center:empty { visibility: hidden; }
    #medicalPopupNoticeSection .mps-text {
      display: block; background: #fff; color: #0b1220; line-height: 1.6; padding: 28px 24px; overflow-y: auto;
      font-size: 14px; word-break: keep-all; text-decoration: none;
    }
    #medicalPopupNoticeSection .mps-text h3 { margin: 0 0 10px; font-size: 20px; font-weight: 900; letter-spacing: -.03em; line-height: 1.3; }
    #medicalPopupNoticeSection .mps-text p { margin: 0; color: rgba(11,18,32,.72); }
    #medicalPopupNoticeSection .mps-text .mps-more { display: inline-block; margin-top: 14px; font-weight: 800; color: #0a6a62; }
  </style>

  <div class="mps-backdrop" aria-hidden="true"></div>

  <div class="mps-overlay">
    <div class="mps-dialog" data-mps-dialog role="dialog" aria-modal="true" aria-label="공지 팝업">
      <div class="mps-slider-wrap">
        <div class="mps-track" data-mps-track></div>
      </div>
    </div>
  </div>

  <script>
    (function(){
      var S = document.getElementById('medicalPopupNoticeSection');
      if(!S || S.__mpsBound) return;
      S.__mpsBound = true;

      function htuCms(){
        if(window.__HTU_CMS_DATA__) return Promise.resolve(window.__HTU_CMS_DATA__);
        if(!window.__htuCmsP){
          var ep = String(window.HTU_CMS_ENDPOINT || '').replace(/\/+$/, '') + '/api/public/content';
          window.__htuCmsP = fetch(ep, { credentials:'omit' })
            .then(function(r){ return r.ok ? r.json() : null; })
            .catch(function(){ return null; });
        }
        return window.__htuCmsP;
      }
      function esc(s){
        return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
          return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
        });
      }

      var KEY = 'medicalPopupNoticeSectionHideUntil';
      function isHiddenToday(){
        try{ var v = localStorage.getItem(KEY); return v && Number(v) > Date.now(); }catch(e){ return false; }
      }
      if(isHiddenToday()) return;

      htuCms().then(function(data){
        data = data || {};
        var st = (data.settings && data.settings.popup) || {};
        var now = Date.now();
        var list = (data.popups || []).filter(function(p){
          if(p.starts_at && new Date(p.starts_at).getTime() > now) return false;
          if(p.ends_at && new Date(p.ends_at).getTime() < now) return false;
          return true;
        });
        if(!list.length) return;
        build(list, st);
      });

      function build(list, st){
        S.setAttribute('data-align', st.align === 'center' ? 'center' : 'left');
        var CHECK = '<span class="mps-check-circle" aria-hidden="true"><svg viewBox="0 0 34 34"><circle class="ck-ring" cx="17" cy="17" r="15.5"></circle><polyline class="ck-mark" points="10.5,17.5 14.8,22 23.5,12.5"></polyline></svg></span>';

        S.querySelector('[data-mps-track]').innerHTML = list.map(function(p, n){
          var target = p.link_new_tab ? ' target="_blank" rel="noopener noreferrer"' : '';
          var media;
          if(p.image_url){
            var img = '<img class="mps-card-image" src="' + esc(p.image_url) + '" alt="' + esc(p.title || ('팝업 이미지 ' + (n + 1))) + '" data-mps-img>';
            media = p.link_url
              ? '<a class="mps-card-link" href="' + esc(p.link_url) + '"' + target + ' aria-label="' + esc(p.title || '팝업') + '">' + img + '</a>'
              : '<div class="mps-card-link">' + img + '</div>';
          }else{
            var inner = (p.title ? '<h3>' + esc(p.title) + '</h3>' : '') + (p.body_html ? '<p>' + p.body_html + '</p>' : '') +
              (p.link_url ? '<span class="mps-more">' + esc(p.link_label || '자세히 보기') + ' →</span>' : '');
            media = p.link_url
              ? '<a class="mps-text" data-mps-text href="' + esc(p.link_url) + '"' + target + '>' + inner + '</a>'
              : '<div class="mps-text" data-mps-text>' + inner + '</div>';
          }
          return '<article class="mps-card"><div class="mps-card-frame" data-mps-frame>' + media +
            '<div class="mps-footer">' +
              '<div class="mps-footer-left"><button class="mps-hide-btn" type="button" data-mps-hide aria-pressed="false" title="오늘 하루 팝업 보지 않기">' + CHECK + '<span class="mps-hide-label">오늘 보지 않기</span></button></div>' +
              '<div class="mps-footer-center">' + (list.length > 1 ? (n + 1) + ' / ' + list.length : '') + '</div>' +
              '<div class="mps-footer-right"><button class="mps-close-btn" type="button" data-mps-close aria-label="닫기"><span class="mps-close-icon" aria-hidden="true"></span></button></div>' +
            '</div></div></article>';
        }).join('');

        init(st);
      }

      /* ===== 아래부터 원본 팝업 로직 ===== */
      function init(st){
        var CFG = window.MPS_CONFIG || {
          PC:     { maxW: Number(st.pc_max_w) || 540, maxH: Number(st.pc_max_h) || 720, footerH: 88 },
          TABLET: { maxW: 340, maxH: 490, footerH: 72 },
          MOBILE: { maxW: 320, maxH: 630, footerH: 70 }
        };
        var PC = CFG.PC, TABLET = CFG.TABLET, MOBILE = CFG.MOBILE;
        function getSize(){
          var w = window.innerWidth;
          if(w <= 420) return MOBILE;
          if(w <= 860) return TABLET;
          return PC;
        }

        var track    = S.querySelector('[data-mps-track]');
        var cards    = [].slice.call(S.querySelectorAll('.mps-card'));
        var hideBtns = [].slice.call(S.querySelectorAll('[data-mps-hide]'));
        var closeBtns= [].slice.call(S.querySelectorAll('[data-mps-close]'));
        var backdrop = S.querySelector('.mps-backdrop');
        var idx = 0, perView = 1, maxIdx = 0, hideChecked = false;

        function fitFrames(){
          var size = getSize();
          var maxW = size.maxW, footerH = size.footerH, imgMaxH = size.maxH - footerH;
          [].slice.call(S.querySelectorAll('[data-mps-frame]')).forEach(function(frame){
            var img    = frame.querySelector('[data-mps-img]');
            var text   = frame.querySelector('[data-mps-text]');
            var footer = frame.querySelector('.mps-footer');
            if(footer) footer.style.height = footerH + 'px';
            if(text){
              frame.style.width = maxW + 'px';
              text.style.maxHeight = imgMaxH + 'px';
              return;
            }
            if(!img) return;
            var nw = img.naturalWidth  || maxW;
            var nh = img.naturalHeight || imgMaxH;
            var ratio = nw / nh;
            var fitW = maxW, fitH = fitW / ratio;
            if(fitH > imgMaxH){ fitH = imgMaxH; fitW = fitH * ratio; }
            fitW = Math.floor(fitW); fitH = Math.floor(fitH);
            frame.style.width = fitW + 'px';
            img.style.width   = fitW + 'px';
            img.style.height  = fitH + 'px';
          });
        }

        function waitImagesAndFit(){
          var imgs = [].slice.call(S.querySelectorAll('[data-mps-img]'));
          var loaded = 0, total = imgs.length;
          function done(){ fitFrames(); render(); S.classList.remove('mps-hidden'); }
          if(total === 0){ done(); return; }
          function check(){ loaded++; if(loaded >= total) done(); }
          imgs.forEach(function(img){
            if(img.complete && img.naturalWidth > 0) check();
            else{ img.addEventListener('load', check, {once:true}); img.addEventListener('error', check, {once:true}); }
          });
        }

        function saveHideToday(){
          try{ var d = new Date(); d.setHours(23,59,59,999); localStorage.setItem(KEY, String(d.getTime())); }catch(e){}
        }
        function closePopup(){
          if(hideChecked) saveHideToday();
          S.classList.add('mps-closing');
          setTimeout(function(){ S.classList.remove('mps-closing'); S.classList.add('mps-hidden'); }, 360);
        }
        function calc(){ perView = 1; maxIdx = Math.max(0, cards.length - perView); if(idx > maxIdx) idx = maxIdx; }
        function render(){
          calc();
          var w = cards[0] ? cards[0].getBoundingClientRect().width : 0;
          track.style.transform = 'translate3d(' + (-(w) * idx) + 'px,0,0)';
        }

        var sliderWrap = S.querySelector('.mps-slider-wrap');
        var dragState = { active:false, startX:0, startY:0, currentX:0, baseOffset:0, dirLocked:false, isHorizontal:false, moved:false };
        var SWIPE_THRESHOLD = 40;
        function getBaseOffset(){ var w = cards[0] ? cards[0].getBoundingClientRect().width : 0; return -(w) * idx; }
        function setTrackPos(px){ track.style.transform = 'translate3d(' + px + 'px,0,0)'; }

        function onDragStart(x, y){
          if(cards.length <= 1) return;
          dragState.active = true; dragState.startX = x; dragState.startY = y; dragState.currentX = x;
          dragState.baseOffset = getBaseOffset(); dragState.dirLocked = false; dragState.isHorizontal = false; dragState.moved = false;
          track.classList.add('is-dragging'); sliderWrap.classList.add('is-dragging');
        }
        function onDragMove(x, y, evt){
          if(!dragState.active) return;
          var dx = x - dragState.startX, dy = y - dragState.startY;
          if(!dragState.dirLocked && (Math.abs(dx) > 8 || Math.abs(dy) > 8)){
            dragState.dirLocked = true; dragState.isHorizontal = Math.abs(dx) >= Math.abs(dy);
          }
          if(dragState.dirLocked && !dragState.isHorizontal) return;
          if(dragState.dirLocked && dragState.isHorizontal){ dragState.moved = true; if(evt.cancelable) evt.preventDefault(); }
          dragState.currentX = x;
          var raw = dx;
          if((idx <= 0 && raw > 0) || (idx >= maxIdx && raw < 0)) raw = raw * 0.3;
          setTrackPos(dragState.baseOffset + raw);
        }
        function onDragEnd(){
          if(!dragState.active) return;
          dragState.active = false;
          track.classList.remove('is-dragging'); sliderWrap.classList.remove('is-dragging');
          var dx = dragState.currentX - dragState.startX;
          if(Math.abs(dx) > SWIPE_THRESHOLD){
            if(dx < 0 && idx < maxIdx) idx++;
            else if(dx > 0 && idx > 0) idx--;
          }
          render();
        }

        sliderWrap.addEventListener('touchstart', function(e){ if(e.touches.length !== 1) return; onDragStart(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
        sliderWrap.addEventListener('touchmove', function(e){ if(e.touches.length !== 1) return; onDragMove(e.touches[0].clientX, e.touches[0].clientY, e); }, {passive:false});
        sliderWrap.addEventListener('touchend', onDragEnd, {passive:true});
        sliderWrap.addEventListener('touchcancel', onDragEnd, {passive:true});
        sliderWrap.addEventListener('mousedown', function(e){
          if(cards.length <= 1 || e.target.closest('button')) return;
          e.preventDefault(); onDragStart(e.clientX, e.clientY);
        });
        document.addEventListener('mousemove', function(e){ if(!dragState.active) return; onDragMove(e.clientX, e.clientY, e); });
        document.addEventListener('mouseup', onDragEnd);
        /* 드래그 직후 링크 클릭 방지 */
        track.addEventListener('click', function(e){
          if(dragState.moved && e.target.closest('a')){ e.preventDefault(); dragState.moved = false; }
        }, true);

        if(backdrop) backdrop.addEventListener('click', function(e){ e.preventDefault(); closePopup(); });

        /* '오늘 보지 않기' 는 모든 카드에서 같은 상태로 동기화 */
        hideBtns.forEach(function(btn){
          btn.addEventListener('click', function(e){
            e.preventDefault(); e.stopPropagation();
            hideChecked = !hideChecked;
            hideBtns.forEach(function(b){
              b.classList.toggle('is-checked', hideChecked);
              b.setAttribute('aria-pressed', hideChecked ? 'true' : 'false');
            });
          });
        });
        closeBtns.forEach(function(btn){ btn.addEventListener('click', function(e){ e.preventDefault(); closePopup(); }); });
        document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !S.classList.contains('mps-hidden')) closePopup(); });

        var resizeTimer;
        window.addEventListener('resize', function(){
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(function(){ fitFrames(); render(); }, 100);
        }, {passive:true});

        waitImagesAndFit();
      }
    })();
  </script>
</section>
