  다른 사이트(아임웹/카페24/정적 HTML 등)에 붙여넣을 때는 이 섹션들보다 위쪽에 아래 한 줄을 1회만 넣어주세요.
  <script>window.HTU_CMS_ENDPOINT = 'https://관리자-배포-도메인';</script>
  내용 수정은 관리자 페이지(/admin)에서 하면 자동 반영됩니다.

<section id="bookshelf-gallery">
  <style>    @keyframes bsg-loading { to { background-position-x:-200%; } }

    #bookshelf-gallery{
      /* ▼ 조절 변수 */
      --bsg-max:900px;                     /* 카드 영역 최대 너비(PC) → 카드 크기 결정 */
      --bsg-side:36px;                     /* 좌우 여백 */
      --bsg-gap:clamp(10px, 2.4vw, 24px);  /* 카드 간격 */
      --bsg-tier-gap:40px;                 /* 1줄-2줄 사이 간격 */

      position:relative;
      width:100%;
      margin:0 auto;
      padding:60px 0 64px;
      background:#e7e5e1 !important;
      font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','Pretendard',sans-serif;
      overflow:hidden;
    }

    #bookshelf-gallery *,
    #bookshelf-gallery *::before,
    #bookshelf-gallery *::after{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    #bookshelf-gallery .bsg-source{ display:none; }

    /* ── Head ── */
    #bookshelf-gallery .bsg-head{
      max-width:calc(var(--bsg-max) + var(--bsg-side) * 2);
      margin:0 auto 20px;
      padding:0 var(--bsg-side);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    #bookshelf-gallery .bsg-title{
      font-size:30px;
      font-weight:900;
      letter-spacing:-1px;
      color:#111;
      line-height:1.2;
    }

    /* 네비는 공간을 항상 차지(visibility) → 슬라이드 수와 무관하게 높이 고정 */
    #bookshelf-gallery .bsg-nav{
      display:flex;
      gap:8px;
      visibility:hidden;
    }

    #bookshelf-gallery.is-multi .bsg-nav{ visibility:visible; }

    #bookshelf-gallery .bsg-nav-btn{
      width:40px;
      height:40px;
      border-radius:999px;
      border:1px solid rgba(0,55,28,.25);
      background:linear-gradient(180deg,#075327 0%,#003f1f 100%);
      color:#fff;
      font-size:25px;
      font-weight:900;
      line-height:1;
      cursor:pointer;
      box-shadow:0 8px 20px rgba(0,55,28,.22);
      transition:transform .22s ease, box-shadow .22s ease, opacity .22s ease;
    }

    #bookshelf-gallery .bsg-nav-btn:disabled{
      opacity:.3;
      cursor:default;
      box-shadow:none;
    }

    @media (hover:hover){
      #bookshelf-gallery .bsg-nav-btn:not(:disabled):hover{
        transform:translateY(-2px);
        box-shadow:0 12px 26px rgba(0,55,28,.32);
      }
    }

    /* ── Slider ── */
    #bookshelf-gallery .bsg-viewport{
      max-width:calc(var(--bsg-max) + var(--bsg-side) * 2);
      margin:0 auto;
      padding:0 var(--bsg-side);
    }

    #bookshelf-gallery .bsg-track{
      display:flex;
      overflow-x:auto;
      overflow-y:hidden;
      scroll-snap-type:x mandatory;
      overscroll-behavior-x:contain;
      scrollbar-width:none;
      -ms-overflow-style:none;
      -webkit-overflow-scrolling:touch;
      user-select:none;
      -webkit-user-select:none;
    }

    #bookshelf-gallery .bsg-track::-webkit-scrollbar{ display:none; }

    #bookshelf-gallery.is-multi .bsg-track{ cursor:grab; }

    #bookshelf-gallery .bsg-track.is-dragging{
      cursor:grabbing;
      scroll-snap-type:none;
    }

    #bookshelf-gallery .bsg-slide{
      flex:0 0 100%;
      min-width:100%;
      scroll-snap-align:start;
      scroll-snap-stop:always;
      padding-top:16px; /* hover 리프트 여유 */
    }

    #bookshelf-gallery .bsg-tier + .bsg-tier{
      margin-top:var(--bsg-tier-gap);
    }

    #bookshelf-gallery .bsg-grid{
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:var(--bsg-gap);
      align-items:end;
      position:relative;
      z-index:3;
    }

    /* ── Card (비율 고정 → 이미지 로딩 전후 높이 변화 없음) ── */
    #bookshelf-gallery .bsg-card,
    #bookshelf-gallery .bsg-slot-empty{
      width:100%;
      aspect-ratio:250 / 356;
    }

    #bookshelf-gallery .bsg-slot-empty{ visibility:hidden; }

    #bookshelf-gallery .bsg-card{
      position:relative;
      border-radius:6px;
      overflow:hidden;
      cursor:pointer;
      background:#ddd;
      box-shadow:0 8px 24px rgba(0,0,0,.12);
      transition:transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s;
      -webkit-tap-highlight-color:transparent;
      container-type:inline-size;
      outline:none;
    }

    #bookshelf-gallery .bsg-card:focus-visible{
      box-shadow:0 0 0 3px #075327, 0 8px 24px rgba(0,0,0,.12);
    }

    #bookshelf-gallery .bsg-card::before{
      content:'';
      position:absolute;
      inset:0;
      z-index:0;
      background:linear-gradient(110deg,#d9d7d3 8%,#eeeeec 18%,#d9d7d3 33%);
      background-size:200% 100%;
      animation:bsg-loading 1.1s linear infinite;
    }

    #bookshelf-gallery .bsg-card.bsg-loaded::before{ display:none; }

    @media (hover:hover){
      #bookshelf-gallery .bsg-card:hover{
        transform:translateY(-12px);
        box-shadow:0 20px 44px rgba(0,0,0,.18);
      }

      #bookshelf-gallery .bsg-track.is-dragging .bsg-card:hover{
        transform:none;
      }

      #bookshelf-gallery .bsg-card:hover .bsg-cover-sub{
        background:linear-gradient(180deg,#0a6833 0%,#004722 100%);
        transform:translateY(-3px);
      }

      #bookshelf-gallery .bsg-card:hover .bsg-cover-sub::after{
        transform:translateX(4px);
      }
    }

    #bookshelf-gallery .bsg-cover{
      width:100%;
      height:100%;
      position:relative;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      overflow:hidden;
      background:#ddd;
    }

    #bookshelf-gallery .bsg-card-img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      z-index:0;
      opacity:0;
      transition:opacity .35s ease;
      user-select:none;
      -webkit-user-drag:none;
      pointer-events:none;
    }

    #bookshelf-gallery .bsg-card-img.is-loaded{ opacity:1; }

    #bookshelf-gallery .bsg-img-overlay{
      position:absolute;
      inset:0;
      z-index:1;
      background:linear-gradient(180deg,rgba(0,0,0,0) 38%,rgba(0,0,0,.52) 100%);
      pointer-events:none;
    }

    /* 카드 내부 텍스트는 카드 너비(cqi) 기준으로 스케일 */
    #bookshelf-gallery .bsg-cover-content{
      position:relative;
      z-index:2;
      width:100%;
      padding:0 5.6cqi 9.6cqi;
      text-align:center;
      color:#fff;
      pointer-events:none;
    }

    #bookshelf-gallery .bsg-cover-title{
      font-size:clamp(10px, 6.8cqi, 17px);
      font-weight:900;
      letter-spacing:-.02em;
      line-height:1.25;
      margin-bottom:clamp(6px, 5.2cqi, 13px);
      text-shadow:0 3px 10px rgba(0,0,0,.5);
      word-break:keep-all;
    }

    #bookshelf-gallery .bsg-cover-sub{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:clamp(3px, 2.8cqi, 7px);
      height:clamp(22px, 14.4cqi, 36px);
      padding:0 clamp(8px, 6.8cqi, 17px);
      border-radius:999px;
      background:linear-gradient(180deg,#075327 0%,#003f1f 100%);
      color:#fff;
      font-size:clamp(9px, 4.8cqi, 12px);
      font-weight:900;
      letter-spacing:-.02em;
      line-height:1;
      white-space:nowrap;
      box-shadow:0 10px 22px rgba(0,55,28,.34), inset 0 1px 0 rgba(255,255,255,.18);
      border:1px solid rgba(255,255,255,.18);
      transition:all .3s cubic-bezier(.22,1,.36,1);
    }

    #bookshelf-gallery .bsg-cover-sub::after{
      content:'›';
      font-size:clamp(12px, 7.2cqi, 18px);
      font-weight:900;
      margin-top:-1px;
      transition:transform .3s cubic-bezier(.22,1,.36,1);
    }

    /* ── Shelf ── */
    #bookshelf-gallery .bsg-shelf{
      position:relative;
      z-index:2;
      margin-top:-1px;
    }

    #bookshelf-gallery .bsg-shelf-top{
      width:100%;
      height:18px;
      background:#f5f4f2;
    }

    #bookshelf-gallery .bsg-shelf-face{
      width:100%;
      height:10px;
      background:#ddd9d4;
    }

    /* ── Dots (항상 공간 확보) ── */
    #bookshelf-gallery .bsg-dots{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:8px;
      height:8px;
      margin-top:28px;
      visibility:hidden;
    }

    #bookshelf-gallery.is-multi .bsg-dots{ visibility:visible; }

    #bookshelf-gallery .bsg-dot{
      width:8px;
      height:8px;
      border-radius:999px;
      border:0;
      background:rgba(0,63,31,.22);
      cursor:pointer;
      transition:width .3s ease, background .3s ease;
    }

    #bookshelf-gallery .bsg-dot.is-active{
      width:22px;
      background:#075327;
    }

    /* ── Modal ── */
    #bookshelf-gallery .bsg-overlay{
      position:fixed;
      inset:0;
      width:100vw;
      height:100dvh;
      background:rgba(0,0,0,.58);
      backdrop-filter:blur(26px) saturate(1.2);
      -webkit-backdrop-filter:blur(26px) saturate(1.2);
      z-index:999999;
      display:none;
      align-items:center;
      justify-content:center;
      opacity:0;
      transition:opacity .3s ease;
      padding:20px;
    }

    #bookshelf-gallery .bsg-overlay.open{
      display:flex !important;
      opacity:1;
    }

    #bookshelf-gallery .bsg-m-wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:16px;
      width:100%;
      max-width:92vw;
      max-height:calc(100dvh - 40px);
    }

    #bookshelf-gallery .bsg-m-card{
      position:relative;
      width:min(86vw,520px);
      max-width:86vw;
      max-height:64dvh;
      border-radius:14px;
      overflow:hidden;
      background:transparent;
      box-shadow:0 30px 80px rgba(0,0,0,.35);
    }

    #bookshelf-gallery .bsg-m-card .bsg-cover{ background:transparent !important; }

    #bookshelf-gallery .bsg-m-card .bsg-card-img{
      object-fit:contain !important;
      opacity:1 !important;
    }

    #bookshelf-gallery .bsg-m-info{ text-align:center; }

    #bookshelf-gallery .bsg-m-title{
      color:#fff;
      font-size:21px;
      font-weight:800;
      margin-bottom:5px;
    }

    #bookshelf-gallery .bsg-m-sub{
      color:rgba(255,255,255,.65);
      font-size:14px;
      white-space:pre-line;
    }

    #bookshelf-gallery .bsg-m-btns{
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:center;
    }

    #bookshelf-gallery .bsg-m-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:190px;
      padding:12px 34px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:#111;
      color:#fff;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      text-decoration:none;
    }

    #bookshelf-gallery .bsg-pdf-btn{
      background:linear-gradient(180deg,#075327 0%,#003f1f 100%);
      border:1px solid rgba(255,255,255,.18);
      box-shadow:0 10px 24px rgba(0,55,28,.38);
    }

    #bookshelf-gallery .bsg-pdf-btn:hover{
      background:linear-gradient(180deg,#0a6833 0%,#004722 100%);
    }

    /* ── Mobile ── */
    @media (max-width:820px){
      #bookshelf-gallery{
        --bsg-side:16px;
        --bsg-gap:10px;
        --bsg-tier-gap:24px;
        padding:38px 0 44px;
      }

      #bookshelf-gallery .bsg-head{ margin-bottom:14px; }
      #bookshelf-gallery .bsg-title{ font-size:24px; }

      #bookshelf-gallery .bsg-nav-btn{
        width:34px;
        height:34px;
        font-size:21px;
      }

      #bookshelf-gallery .bsg-slide{ padding-top:8px; }
      #bookshelf-gallery .bsg-shelf-top{ height:12px; }
      #bookshelf-gallery .bsg-shelf-face{ height:7px; }
      #bookshelf-gallery .bsg-dots{ margin-top:20px; }
    }

    @media (max-width:420px){
      #bookshelf-gallery .bsg-title{ font-size:22px; }
    }
</style>

  <div class="bsg-head">
    <h2 class="bsg-title" data-cms="title">전문가 연재</h2>
    <div class="bsg-nav">
      <button class="bsg-nav-btn bsg-prev" type="button" aria-label="이전">‹</button>
      <button class="bsg-nav-btn bsg-next" type="button" aria-label="다음">›</button>
    </div>
  </div>

  <div class="bsg-viewport">
    <div class="bsg-track" aria-roledescription="carousel"></div>
    <div class="bsg-dots"></div>
  </div>

  <div class="bsg-overlay" id="bsgOv">
    <div class="bsg-m-wrap">
      <div class="bsg-m-card" id="bsgMC"></div>
      <div class="bsg-m-info">
        <div class="bsg-m-title" id="bsgMT"></div>
        <div class="bsg-m-sub" id="bsgMS"></div>
      </div>
      <div class="bsg-m-btns">
        <a class="bsg-m-btn bsg-pdf-btn" id="bsgPdfBtn" href="#" target="_blank" rel="noopener">PDF 파일 보기</a>
        <button class="bsg-m-btn" id="bsgMBtn" type="button">닫기</button>
      </div>
    </div>
  </div>

  <script>
    (function(){
      var gallery = document.getElementById('bookshelf-gallery');
      if(!gallery || gallery.__htuInit) return;
      gallery.__htuInit = true;

      function htuCms(){
        if(window.__HTU_CMS_DATA__) return Promise.resolve(window.__HTU_CMS_DATA__);
        if(!window.__htuCmsP){
          var ep = String(window.HTU_CMS_ENDPOINT || '').replace(/\/+$/, '') + '/api/public/content';
          window.__htuCmsP = fetch(ep, { credentials:'omit' })
            .then(function(r){ return r.ok ? r.json() : null; })
            .catch(function(){ return null; });
        }
        return window.__htuCmsP;
      }

      htuCms().then(function(data){
        data = data || {};
        var st = (data.settings && data.settings.columns) || {};
        var list = data.columns || [];
        if(!list.length){ gallery.style.display = 'none'; return; }
        init(st, list);
      });

      function init(st, list){
        var COLS = 3, ROWS = 2, PER = COLS * ROWS;

        var track    = gallery.querySelector('.bsg-track');
        var dotsWrap = gallery.querySelector('.bsg-dots');
        var prevBtn  = gallery.querySelector('.bsg-prev');
        var nextBtn  = gallery.querySelector('.bsg-next');

        var overlay    = document.getElementById('bsgOv');
        var modalCard  = document.getElementById('bsgMC');
        var modalTitle = document.getElementById('bsgMT');
        var modalSub   = document.getElementById('bsgMS');
        var modalBtn   = document.getElementById('bsgMBtn');
        var pdfBtn     = document.getElementById('bsgPdfBtn');

        gallery.querySelector('[data-cms="title"]').textContent = st.title || '전문가 연재';
        pdfBtn.textContent = st.pdf_button || 'PDF 파일 보기';

        function el(cls){ var d = document.createElement('div'); d.className = cls; return d; }

        /* ── 데이터 → 카드 엘리먼트 ── */
        var cards = list.map(function(it){
          var card = el('bsg-card');
          card.setAttribute('data-t', it.title || it.card_title || '');
          card.setAttribute('data-s', it.subtitle || '');
          card.setAttribute('data-img-src', it.image_url || '');
          card.setAttribute('data-pdf-url', it.pdf_url || '');
          var cover = el('bsg-cover');
          var content = el('bsg-cover-content');
          var t = el('bsg-cover-title'); t.textContent = it.card_title || it.title || '';
          var s = el('bsg-cover-sub'); s.textContent = st.card_button || '연재 보기';
          content.appendChild(t); content.appendChild(s);
          cover.appendChild(content); card.appendChild(cover);
          return card;
        });

        var slideCount = Math.max(1, Math.ceil(cards.length / PER));
        var current = 0;
        var dots = [];

        /* ── 슬라이드 빌드: 항상 3x2 슬롯 유지 ── */
        for(var s = 0; s < slideCount; s++){
          var slide = el('bsg-slide');
          slide.setAttribute('role', 'group');
          slide.setAttribute('aria-label', (s + 1) + ' / ' + slideCount);

          for(var r = 0; r < ROWS; r++){
            var tier = el('bsg-tier');
            var grid = el('bsg-grid');
            for(var c = 0; c < COLS; c++){
              var card = cards[s * PER + r * COLS + c];
              if(card){
                card.setAttribute('tabindex', '0');
                card.setAttribute('role', 'button');
                grid.appendChild(card);
              }else{
                var empty = el('bsg-slot-empty');
                empty.setAttribute('aria-hidden', 'true');
                grid.appendChild(empty);
              }
            }
            var shelf = el('bsg-shelf');
            shelf.innerHTML = '<div class="bsg-shelf-top"></div><div class="bsg-shelf-face"></div>';
            tier.appendChild(grid);
            tier.appendChild(shelf);
            slide.appendChild(tier);
          }
          track.appendChild(slide);

          var dot = document.createElement('button');
          dot.type = 'button';
          dot.className = 'bsg-dot';
          dot.setAttribute('aria-label', (s + 1) + '번 슬라이드');
          (function(i){ dot.addEventListener('click', function(){ goTo(i); }); })(s);
          dotsWrap.appendChild(dot);
          dots.push(dot);
        }

        gallery.classList.toggle('is-multi', slideCount > 1);

        /* ── 이미지 ── */
        cards.forEach(function(cardEl, idx){
          var src = cardEl.getAttribute('data-img-src');
          var cover = cardEl.querySelector('.bsg-cover');
          if(!src || !cover){ cardEl.classList.add('bsg-loaded'); return; }

          var img = document.createElement('img');
          img.className = 'bsg-card-img';
          img.alt = cardEl.getAttribute('data-t') || '';
          img.draggable = false;
          img.decoding = 'async';
          img.loading = idx < PER ? 'eager' : 'lazy';
          if(idx < PER){ try{ img.fetchPriority = 'high'; }catch(e){} }

          img.onload = function(){ img.classList.add('is-loaded'); cardEl.classList.add('bsg-loaded'); };
          img.onerror = function(){ img.style.display = 'none'; cardEl.classList.add('bsg-loaded'); };
          img.src = src;

          var ovl = el('bsg-img-overlay');
          cover.insertBefore(img, cover.firstChild);
          cover.insertBefore(ovl, img.nextSibling);

          if(img.complete && img.naturalWidth > 0){
            img.classList.add('is-loaded');
            cardEl.classList.add('bsg-loaded');
          }
        });

        /* ── 슬라이드 이동 ── */
        function slideW(){ return track.clientWidth || 1; }

        function updateUI(){
          prevBtn.disabled = current <= 0;
          nextBtn.disabled = current >= slideCount - 1;
          dots.forEach(function(d, i){ d.classList.toggle('is-active', i === current); });
        }

        function goTo(i, instant){
          current = Math.max(0, Math.min(slideCount - 1, i));
          track.scrollTo({ left: current * slideW(), behavior: instant ? 'auto' : 'smooth' });
          updateUI();
          if(autoReady && !instant) restartAuto();
        }

        prevBtn.addEventListener('click', function(){ goTo(current - 1); });
        nextBtn.addEventListener('click', function(){ goTo(current + 1); });

        var scrollRaf = 0;
        track.addEventListener('scroll', function(){
          if(drag.active) return;
          cancelAnimationFrame(scrollRaf);
          scrollRaf = requestAnimationFrame(function(){
            var i = Math.round(track.scrollLeft / slideW());
            if(i !== current){ current = i; updateUI(); if(autoReady) restartAuto(); }
          });
        }, { passive:true });

        var resizeRaf = 0;
        function keepPosition(){
          cancelAnimationFrame(resizeRaf);
          resizeRaf = requestAnimationFrame(function(){ goTo(current, true); });
        }
        if('ResizeObserver' in window){ new ResizeObserver(keepPosition).observe(track); }
        else{ window.addEventListener('resize', keepPosition); }

        /* ── 마우스 드래그 ── */
        var drag = { down:false, active:false, moved:false, x:0, left:0 };
        var dragEndTimer = 0;

        track.addEventListener('pointerdown', function(e){
          if(e.pointerType !== 'mouse' || e.button !== 0 || slideCount < 2) return;
          drag.down = true; drag.moved = false;
          drag.x = e.clientX; drag.left = track.scrollLeft;
        });

        track.addEventListener('pointermove', function(e){
          if(!drag.down) return;
          var dx = e.clientX - drag.x;
          if(!drag.moved && Math.abs(dx) > 6){
            drag.moved = true; drag.active = true;
            clearTimeout(dragEndTimer);
            track.classList.add('is-dragging');
            try{ track.setPointerCapture(e.pointerId); }catch(err){}
          }
          if(drag.moved) track.scrollLeft = drag.left - dx;
        });

        function endDrag(e){
          if(!drag.down) return;
          drag.down = false;
          if(!drag.moved) return;
          var dx = (e && typeof e.clientX === 'number') ? e.clientX - drag.x : 0;
          var base = Math.round(drag.left / slideW());
          var threshold = slideW() * 0.12;
          var target = dx < -threshold ? base + 1 : dx > threshold ? base - 1 : base;
          goTo(target);
          dragEndTimer = setTimeout(function(){
            drag.active = false;
            track.classList.remove('is-dragging');
            if(autoReady) restartAuto();
          }, 450);
        }
        track.addEventListener('pointerup', endDrag);
        track.addEventListener('pointercancel', endDrag);

        /* 가로 휠 차단, 세로 휠은 페이지로 */
        track.addEventListener('wheel', function(e){
          var horizontal = e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY);
          if(!horizontal) return;
          e.preventDefault();
          if(e.shiftKey && Math.abs(e.deltaY) > Math.abs(e.deltaX)){
            window.scrollBy({ top: e.deltaY, behavior: 'auto' });
          }
        }, { passive:false });

        /* ── 카드 클릭 / 키보드 ── */
        track.addEventListener('click', function(e){
          if(drag.moved){ drag.moved = false; return; }
          var card = e.target.closest('.bsg-card');
          if(card) openModal(card);
        });
        track.addEventListener('keydown', function(e){
          var card = e.target.closest('.bsg-card');
          if(card && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); openModal(card); }
        });
        track.addEventListener('focusin', function(e){
          var slide = e.target.closest('.bsg-slide');
          if(!slide) return;
          var i = Array.prototype.indexOf.call(track.children, slide);
          if(i !== current) goTo(i);
        });

        /* ── Modal ── */
        function setModalSizeByImage(src, callback){
          var tempImg = new Image();
          tempImg.onload = function(){
            var ratio = tempImg.naturalWidth / tempImg.naturalHeight;
            var maxW = Math.min(window.innerWidth * .86, 620);
            var maxH = window.innerHeight * .64;
            if(window.innerWidth <= 768){ maxW = window.innerWidth * .86; maxH = window.innerHeight * .58; }
            var finalW = maxW;
            var finalH = finalW / ratio;
            if(finalH > maxH){ finalH = maxH; finalW = finalH * ratio; }
            modalCard.style.width = finalW + 'px';
            modalCard.style.height = finalH + 'px';
            callback();
          };
          tempImg.onerror = function(){
            modalCard.style.width = 'min(86vw,420px)';
            modalCard.style.height = '58dvh';
            callback();
          };
          tempImg.src = src;
        }

        function openModal(cardEl){
          var src = cardEl.getAttribute('data-img-src') || '';
          var pdfUrl = cardEl.getAttribute('data-pdf-url') || '';

          modalCard.innerHTML = '';
          var cover = el('bsg-cover');
          var img = document.createElement('img');
          img.className = 'bsg-card-img is-loaded';
          img.src = src;
          img.alt = cardEl.getAttribute('data-t') || '';
          img.draggable = false;
          cover.appendChild(img);
          modalCard.appendChild(cover);

          modalTitle.textContent = cardEl.getAttribute('data-t') || '';
          modalSub.textContent = cardEl.getAttribute('data-s') || '';

          if(pdfUrl.trim()){ pdfBtn.href = pdfUrl; pdfBtn.style.display = 'inline-flex'; }
          else{ pdfBtn.style.display = 'none'; }

          pause.modal = true;
          stopAuto();

          setModalSizeByImage(src, function(){
            overlay.style.display = 'flex';
            requestAnimationFrame(function(){ overlay.classList.add('open'); });
            document.documentElement.style.overflow = 'hidden';
            document.body.style.overflow = 'hidden';
          });
        }

        function closeModal(){
          overlay.classList.remove('open');
          overlay.style.opacity = '0';
          setTimeout(function(){
            overlay.style.display = 'none';
            overlay.style.opacity = '';
            modalCard.innerHTML = '';
          }, 300);
          document.documentElement.style.overflow = '';
          document.body.style.overflow = '';
          pause.modal = false;
          restartAuto();
        }

        overlay.addEventListener('click', function(e){ if(!e.target.closest('.bsg-m-wrap')) closeModal(); });
        modalBtn.addEventListener('click', closeModal);
        document.addEventListener('keydown', function(e){
          if(e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
        });

        /* ── 자동 슬라이드 ── */
        var AUTO_DELAY = Number(st.auto_delay);
        if(!(AUTO_DELAY >= 0)) AUTO_DELAY = 5000;
        var autoTimer = 0;
        var autoReady = false;
        var pause = { hover:false, touch:false, focus:false, modal:false, offscreen:false, hidden:false };

        function isPaused(){
          if(slideCount < 2 || drag.active) return true;
          for(var k in pause){ if(pause[k]) return true; }
          return false;
        }
        function stopAuto(){ clearTimeout(autoTimer); }
        function restartAuto(){
          stopAuto();
          if(!autoReady || isPaused()) return;
          autoTimer = setTimeout(function(){
            if(isPaused()) return;
            goTo(current >= slideCount - 1 ? 0 : current + 1);
          }, AUTO_DELAY);
        }
        function setPause(key, val){ pause[key] = val; val ? stopAuto() : restartAuto(); }

        gallery.addEventListener('pointerenter', function(e){ if(e.pointerType === 'mouse') setPause('hover', true); });
        gallery.addEventListener('pointerleave', function(e){ if(e.pointerType === 'mouse') setPause('hover', false); });
        track.addEventListener('touchstart', function(){ setPause('touch', true); }, { passive:true });
        track.addEventListener('touchend', function(){ setPause('touch', false); }, { passive:true });
        track.addEventListener('touchcancel', function(){ setPause('touch', false); }, { passive:true });
        gallery.addEventListener('focusin', function(e){ if(e.target.closest('.bsg-card')) setPause('focus', true); });
        gallery.addEventListener('focusout', function(e){
          if(!gallery.contains(e.relatedTarget) || !e.relatedTarget.closest('.bsg-card')) setPause('focus', false);
        });
        document.addEventListener('visibilitychange', function(){ setPause('hidden', document.hidden); });
        if('IntersectionObserver' in window){
          new IntersectionObserver(function(entries){
            setPause('offscreen', !entries[0].isIntersecting);
          }, { threshold:0.25 }).observe(gallery);
        }
        if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){ AUTO_DELAY = 0; }

        updateUI();
        if(AUTO_DELAY > 0){ autoReady = true; restartAuto(); }
      }
    })();
  </script>
</section>
