<!--
  [HTU CMS 섹션] news-event.html
  다른 사이트(아임웹/카페24/정적 HTML 등)에 붙여넣을 때는 이 섹션들보다 위쪽에 아래 한 줄을 1회만 넣어주세요.
  <script>window.HTU_CMS_ENDPOINT = 'https://관리자-배포-도메인';</script>
  내용 수정은 관리자 페이지(/admin)에서 하면 자동 반영됩니다.
-->
<section id="newsSlideSection" aria-label="뉴스 슬라이드 섹션" style="position: relative;">
  <style>    /* ===============================
   Scope: #newsSlideSection ONLY
   =============================== */
    #newsSlideSection {
      --bg: #ffffff;
      --card: #ffffff;
      --ink: #0b0b0b;
      --muted: rgba(11, 11, 11, .62);
      --subtle: rgba(11, 11, 11, .08);
      --line: rgba(11, 11, 11, .10);
      --accent: #0b5fff;
      --radius: 18px;
      --radius2: 14px;
      --gap: 18px;
      --shadow: 0 10px 30px rgba(0, 0, 0, .08);
      --shadow2: 0 8px 22px rgba(0, 0, 0, .06);
      --title-lines: 2;
      --title-lh: 1.42;
      --excerpt-lines: 3;
      --excerpt-lh: 1.68;
      --text-min-h: 148px;
      font-family: Pretendard, "Noto Sans KR", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding: 86px 20px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    #newsSlideSection * {
      box-sizing: border-box;
    }

    #newsSlideSection .wrap {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ===== Header ===== */
    #newsSlideSection .head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    #newsSlideSection .head-left {
      min-width: 0;
    }

    #newsSlideSection .head-left h2 {
      margin: 0;
      font-size: 34px;
      font-weight: 950;
      letter-spacing: -.04em;
      line-height: 1.12;
    }

    #newsSlideSection .head-left p {
      margin: 10px 0 0;
      font-size: 15px;
      color: var(--muted);
      line-height: 1.55;
      max-width: 740px;
    }

    /* Header right buttons */
    #newsSlideSection .head-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    #newsSlideSection .head-btn {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .92);
      color: rgba(11, 11, 11, .86);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(0, 0, 0, .06);
      transition: transform .14s ease, background .14s ease, border-color .14s ease, box-shadow .14s ease, opacity .14s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #newsSlideSection .head-btn svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    #newsSlideSection .head-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(11, 11, 11, .16);
      box-shadow: 0 14px 30px rgba(0, 0, 0, .08);
    }

    #newsSlideSection .head-btn:active {
      transform: translateY(0px) scale(.98);
    }

    #newsSlideSection .head-btn[disabled] {
      opacity: .35;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ===== Slider ===== */
    #newsSlideSection .slider {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      border: 1px solid var(--subtle);
      background: rgba(0, 0, 0, .015);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    #newsSlideSection .track {
      position: relative;
      min-height: 1px;
      overflow: hidden;
      transition: height .28s ease;
    }

    #newsSlideSection .track.is-mobile {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--gap);
      height: auto !important;
    }

    #newsSlideSection .page {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--gap);
      min-height: 1px;
      will-change: transform;
      transition: transform .72s cubic-bezier(.22, .61, .36, 1);
      backface-visibility: hidden;
      transform: translate3d(0, 0, 0);
      align-items: stretch;
    }

    #newsSlideSection .page.is-abs {
      position: absolute;
      inset: 0;
    }

    #newsSlideSection .slide {
      min-width: 0;
      height: 100%;
    }

    #newsSlideSection .slide>a {
      display: block;
      height: 100%;
      text-decoration: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #newsSlideSection .slide>a:focus {
      outline: 2px solid rgba(11, 95, 255, .42);
      outline-offset: 2px;
      border-radius: var(--radius2);
    }

    /* ===== Card ===== */
    #newsSlideSection .news-card {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--card);
      border: 1px solid var(--subtle);
      border-radius: var(--radius2);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow2);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    #newsSlideSection .news-card:hover {
      transform: translateY(-2px);
      border-color: rgba(11, 11, 11, .12);
      box-shadow: 0 16px 40px rgba(0, 0, 0, .10);
    }

    #newsSlideSection .thumb {
      position: relative;
      background: #f3f5f8;
      aspect-ratio: 16/9;
      overflow: hidden;
      flex-shrink: 0;
    }

    #newsSlideSection .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1.01);
      transition: transform .6s ease;
    }

    #newsSlideSection .news-card:hover .thumb img {
      transform: scale(1.07);
    }

    #newsSlideSection .thumb:after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 44%;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0), rgba(0, 0, 0, .14));
      pointer-events: none;
    }

    #newsSlideSection .text {
      padding: 18px 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      min-width: 0;
      min-height: var(--text-min-h);
    }

    #newsSlideSection .title {
      margin: 0;
      font-size: 18px;
      font-weight: 950;
      line-height: var(--title-lh);
      letter-spacing: -.02em;
      display: -webkit-box;
      -webkit-line-clamp: var(--title-lines);
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: calc(1em * var(--title-lh) * var(--title-lines));
      max-height: calc(1em * var(--title-lh) * var(--title-lines));
    }

    #newsSlideSection .excerpt {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
      line-height: var(--excerpt-lh);
      display: -webkit-box;
      -webkit-line-clamp: var(--excerpt-lines);
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: calc(1em * var(--excerpt-lh) * var(--excerpt-lines));
      max-height: calc(1em * var(--excerpt-lh) * var(--excerpt-lines));
    }

    #newsSlideSection .head-btn:focus,
    #newsSlideSection .news-card:focus {
      outline: 2px solid rgba(11, 95, 255, .42);
      outline-offset: 2px;
    }

    #newsSlideSection .more-wrap {
      display: none;
      justify-content: center;
      margin-top: 18px;
    }

    #newsSlideSection .more-btn {
      min-width: 160px;
      padding: 14px 20px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.01em;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(0, 0, 0, .06);
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease, opacity .16s ease;
      -webkit-tap-highlight-color: transparent;
    }

    #newsSlideSection .more-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(11, 11, 11, .16);
      box-shadow: 0 14px 30px rgba(0, 0, 0, .08);
    }

    #newsSlideSection .more-btn:active {
      transform: translateY(0) scale(.98);
    }

    #newsSlideSection .more-btn[hidden] {
      display: none !important;
    }

    @media (max-width: 900px) {
      #newsSlideSection {
        --text-min-h: auto;
        padding: 68px 16px;
      }

      #newsSlideSection .head-left h2 {
        font-size: 28px;
      }

      #newsSlideSection .slider {
        padding: 12px;
      }

      #newsSlideSection .page {
        grid-template-columns: 1fr;
      }

      #newsSlideSection .text {
        min-height: auto;
      }

      #newsSlideSection .more-wrap {
        display: flex;
      }
    }

    @media (max-width: 520px) {
      #newsSlideSection .head {
        align-items: flex-start;
      }

      #newsSlideSection .head-left p {
        margin-top: 8px;
        font-size: 14px;
      }

      #newsSlideSection .head-btn {
        width: 38px;
        height: 38px;
      }

      #newsSlideSection .head-btn svg {
        width: 17px;
        height: 17px;
      }
    }
</style>
  <style>
    /* ===== CMS 추가: 출처 배지 / 공지사항 버튼 ===== */
    #newsSlideSection .src-chip {
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 26px;
      padding: 0 11px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: -.01em;
      color: #0b1220;
      background: rgba(255, 255, 255, .9);
      border: 1px solid rgba(255, 255, 255, .7);
      box-shadow: 0 6px 16px rgba(0, 0, 0, .12);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }
    #newsSlideSection .src-chip[data-type="internal"] { color: #fff; background: linear-gradient(135deg, #0a4f30, #0a6a62); border-color: transparent; }
    #newsSlideSection .src-chip svg { width: 12px; height: 12px; display: block; }
    #newsSlideSection .src-chip:empty { display: none; }

    #newsSlideSection .notice-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 40px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .92);
      color: rgba(11, 11, 11, .86);
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 10px 22px rgba(0, 0, 0, .06);
      transition: transform .14s ease, border-color .14s ease, box-shadow .14s ease;
    }
    #newsSlideSection .notice-link:hover { transform: translateY(-1px); border-color: rgba(11, 11, 11, .16); box-shadow: 0 14px 30px rgba(0, 0, 0, .08); }
    #newsSlideSection .notice-link[hidden] { display: none; }
    @media (max-width: 520px) { #newsSlideSection .notice-link { height: 38px; padding: 0 13px; font-size: 13px; } }
  </style>

  <div class="wrap">
    <div class="head">
      <div class="head-left">
        <h2 data-cms="title">News &amp; Event</h2>
      </div>
      <div class="head-right" aria-label="뉴스 슬라이드 버튼">
        <a class="notice-link" href="#" hidden>공지사항 <span aria-hidden="true">›</span></a>
        <button type="button" class="head-btn prev" id="newsPrev" aria-label="이전 뉴스 페이지">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M14.5 5.5L8 12l6.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <button type="button" class="head-btn next" id="newsNext" aria-label="다음 뉴스 페이지">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9.5 18.5L16 12 9.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </div>

    <div class="slider" aria-label="뉴스 카드 슬라이더">
      <div class="track" id="newsTrack"></div>
    </div>
    <div class="more-wrap">
      <button type="button" class="more-btn" id="newsMoreBtn">더 보기</button>
    </div>

    <template id="newsSlideTemplate">
      <div class="slide">
        <a class="slide-link" href="#" target="_self" rel="noopener">
          <div class="news-card">
            <div class="thumb">
              <img src="" alt="">
              <span class="src-chip"></span>
            </div>
            <div class="text">
              <h3 class="title">Title</h3>
              <p class="excerpt">Excerpt</p>
            </div>
          </div>
        </a>
      </div>
    </template>
  </div>

  <script>
    (function () {
      var section = document.getElementById('newsSlideSection');
      if (!section || section.__htuInit) return;
      section.__htuInit = true;

      function htuCms() {
        if (window.__HTU_CMS_DATA__) return Promise.resolve(window.__HTU_CMS_DATA__);
        if (!window.__htuCmsP) {
          var ep = String(window.HTU_CMS_ENDPOINT || '').replace(/\/+$/, '') + '/api/public/content';
          window.__htuCmsP = fetch(ep, { credentials: 'omit' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        }
        return window.__htuCmsP;
      }

      var ARROW = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 16 16 8M9.5 8H16v6.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      htuCms().then(function (data) {
        data = data || {};
        var st = (data.settings && data.settings.news) || {};
        var items = data.news || [];
        if (!items.length) { section.style.display = 'none'; return; }
        section.querySelector('[data-cms="title"]').textContent = st.title || 'News & Event';
        var notice = section.querySelector('.notice-link');
        if (st.show_notice_link !== false && data.links && data.links.notice) {
          notice.href = data.links.notice;
          notice.hidden = false;
        }
        init(items, st);
      });

      function init(items, st) {
        var track = section.querySelector('#newsTrack');
        var tpl = section.querySelector('#newsSlideTemplate');
        var btnPrev = section.querySelector('#newsPrev');
        var btnNext = section.querySelector('#newsNext');
        var moreBtn = section.querySelector('#newsMoreBtn');
        var mobileMq = window.matchMedia('(max-width: 900px)');
        var showBadge = st.show_source_badge !== false;
        var interval = Number(st.auto_interval) || 4200;

        var currentPage = 0;
        var pageCount = 1;
        var autoTimer = null;
        var mobileVisibleCount = 5;
        var dragStartX = 0;
        var isDragging = false;
        var isAnimating = false;
        var desktopFixedTrackHeight = 0;

        function isMobile() { return mobileMq.matches; }
        function getPageSize() { return 6; }

        function buildSlide(item) {
          var node = tpl.content.cloneNode(true);
          var slide = node.querySelector('.slide');
          var linkEl = node.querySelector('.slide-link');
          var img = node.querySelector('img');
          var title = node.querySelector('.title');
          var excerpt = node.querySelector('.excerpt');
          var chip = node.querySelector('.src-chip');

          var href = item.link || '#';
          linkEl.href = href;
          var target = item.target || (/^https?:\/\//i.test(href) ? '_blank' : '_self');
          linkEl.target = target;
          linkEl.rel = target === '_blank' ? 'noopener noreferrer' : 'noopener';

          title.textContent = item.title || '';
          excerpt.textContent = item.excerpt || '';
          img.src = item.img || '';
          img.alt = item.title ? item.title : 'news thumbnail';

          if (showBadge && chip) {
            chip.setAttribute('data-type', item.type || 'external');
            chip.innerHTML = item.type === 'internal' ? 'HTU 소식' : '외부 기사 ' + ARROW;
          }
          if (!item.img) {
            var thumb = node.querySelector('.thumb');
            if (thumb) thumb.style.display = 'none';
          }
          return slide;
        }

        function buildPage(pageIndex) {
          var pageSize = getPageSize();
          var start = pageIndex * pageSize;
          var page = document.createElement('div');
          page.className = 'page';
          items.slice(start, start + pageSize).forEach(function (item) { page.appendChild(buildSlide(item)); });
          return page;
        }

        function measureDesktopFixedHeight() {
          if (isMobile()) { desktopFixedTrackHeight = 0; track.style.height = ''; return; }
          var totalPages = Math.max(1, Math.ceil(items.length / getPageSize()));
          var probe = document.createElement('div');
          probe.style.position = 'absolute';
          probe.style.left = '0';
          probe.style.top = '0';
          probe.style.width = track.clientWidth ? track.clientWidth + 'px' : '100%';
          probe.style.visibility = 'hidden';
          probe.style.pointerEvents = 'none';
          probe.style.zIndex = '-1';
          section.appendChild(probe);
          var maxHeight = 0;
          for (var i = 0; i < totalPages; i++) {
            var page = buildPage(i);
            probe.appendChild(page);
            var h = page.offsetHeight;
            if (h > maxHeight) maxHeight = h;
            probe.removeChild(page);
          }
          probe.remove();
          desktopFixedTrackHeight = maxHeight;
          if (desktopFixedTrackHeight > 0) track.style.height = desktopFixedTrackHeight + 'px';
        }

        function setTrackHeightFrom(el) {
          if (isMobile()) { track.style.height = ''; return; }
          if (desktopFixedTrackHeight > 0) { track.style.height = desktopFixedTrackHeight + 'px'; return; }
          if (!el) return;
          var h = el.offsetHeight;
          if (h > 0) track.style.height = h + 'px';
        }

        function syncButtons() {
          var multi = Math.ceil(items.length / getPageSize()) > 1;
          if (isMobile() || !multi) {
            if (btnPrev) btnPrev.style.display = 'none';
            if (btnNext) btnNext.style.display = 'none';
            return;
          }
          if (btnPrev) { btnPrev.style.display = ''; btnPrev.disabled = isAnimating; }
          if (btnNext) { btnNext.style.display = ''; btnNext.disabled = isAnimating; }
        }

        function syncMoreButton() {
          if (!moreBtn) return;
          if (!isMobile()) { moreBtn.hidden = true; return; }
          moreBtn.hidden = mobileVisibleCount >= items.length;
        }

        function renderMobile() {
          isAnimating = false;
          track.classList.add('is-mobile');
          track.innerHTML = '';
          items.slice(0, mobileVisibleCount).forEach(function (item) { track.appendChild(buildSlide(item)); });
          track.style.height = '';
          syncButtons();
          syncMoreButton();
        }

        function renderDesktopInitial() {
          track.classList.remove('is-mobile');
          pageCount = Math.max(1, Math.ceil(items.length / getPageSize()));
          if (currentPage > pageCount - 1) currentPage = pageCount - 1;
          if (currentPage < 0) currentPage = 0;
          track.innerHTML = '';
          var page = buildPage(currentPage);
          page.classList.add('is-active');
          track.appendChild(page);
          requestAnimationFrame(function () { measureDesktopFixedHeight(); setTrackHeightFrom(page); });
          syncButtons();
          syncMoreButton();
        }

        function transitionToPage(nextPageIndex, direction) {
          if (isMobile() || isAnimating) return;
          pageCount = Math.max(1, Math.ceil(items.length / getPageSize()));
          nextPageIndex = Math.max(0, Math.min(pageCount - 1, nextPageIndex));
          var currentEl = track.querySelector('.page.is-active');
          if (!currentEl) { currentPage = nextPageIndex; renderDesktopInitial(); return; }
          if (nextPageIndex === currentPage) { syncButtons(); return; }

          isAnimating = true;
          syncButtons();

          var nextEl = buildPage(nextPageIndex);
          nextEl.classList.add('is-abs');
          var enterFrom = direction === 1 ? '100%' : '-100%';
          var leaveTo = direction === 1 ? '-100%' : '100%';

          currentEl.classList.add('is-abs');
          currentEl.style.transform = 'translate3d(0,0,0)';
          nextEl.style.transform = 'translate3d(' + enterFrom + ',0,0)';
          track.appendChild(nextEl);

          if (desktopFixedTrackHeight > 0) track.style.height = desktopFixedTrackHeight + 'px';
          else track.style.height = Math.max(currentEl.offsetHeight || 0, nextEl.offsetHeight || 0) + 'px';

          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              currentEl.style.transform = 'translate3d(' + leaveTo + ',0,0)';
              nextEl.style.transform = 'translate3d(0,0,0)';
            });
          });

          var done = false;
          function cleanup() {
            if (done) return;
            done = true;
            currentPage = nextPageIndex;
            currentEl.remove();
            nextEl.classList.remove('is-abs');
            nextEl.classList.add('is-active');
            nextEl.style.transform = 'translate3d(0,0,0)';
            nextEl.style.position = '';
            nextEl.style.inset = '';
            setTrackHeightFrom(nextEl);
            isAnimating = false;
            syncButtons();
            syncMoreButton();
          }
          nextEl.addEventListener('transitionend', function onEnd(e) {
            if (e.propertyName !== 'transform') return;
            nextEl.removeEventListener('transitionend', onEnd);
            cleanup();
          });
          setTimeout(cleanup, 900);
        }

        function render() { if (isMobile()) renderMobile(); else renderDesktopInitial(); }

        function next() {
          if (isMobile() || isAnimating || pageCount < 2) return;
          transitionToPage(currentPage >= pageCount - 1 ? 0 : currentPage + 1, 1);
        }
        function prev() {
          if (isMobile() || isAnimating || pageCount < 2) return;
          transitionToPage(currentPage <= 0 ? pageCount - 1 : currentPage - 1, -1);
        }
        function stopAuto() { if (autoTimer) clearInterval(autoTimer); autoTimer = null; }
        function startAuto() {
          stopAuto();
          if (isMobile() || interval <= 0) return;
          autoTimer = setInterval(function () { if (!isAnimating) next(); }, interval);
        }
        function onMore() { mobileVisibleCount += 5; renderMobile(); }

        function onPointerDown(e) {
          if (isMobile() || isAnimating) return;
          dragStartX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
          isDragging = true;
        }
        function onPointerUp(e) {
          if (!isDragging || isMobile() || isAnimating) return;
          var endX = e.clientX || (e.changedTouches && e.changedTouches[0].clientX) || 0;
          var diff = endX - dragStartX;
          if (Math.abs(diff) > 60) { if (diff < 0) next(); else prev(); }
          isDragging = false;
        }

        if (btnPrev) btnPrev.addEventListener('click', prev);
        if (btnNext) btnNext.addEventListener('click', next);
        if (moreBtn) moreBtn.addEventListener('click', onMore);
        section.addEventListener('mouseenter', stopAuto);
        section.addEventListener('mouseleave', startAuto);
        track.addEventListener('mousedown', onPointerDown);
        track.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchend', onPointerUp);

        var resizeTimer = null;
        var wasMobile = isMobile();
        window.addEventListener('resize', function () {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(function () {
            var nowMobile = isMobile();
            if (nowMobile && !wasMobile) mobileVisibleCount = 5;
            wasMobile = nowMobile;
            isAnimating = false;
            desktopFixedTrackHeight = 0;
            render();
            startAuto();
          }, 120);
        });

        render();
        startAuto();
      }
    })();
  </script>
</section>
