<!--
  [HTU CMS 섹션] layer-popup.html
  다른 사이트(아임웹/카페24/정적 HTML 등)에 붙여넣을 때는 이 섹션들보다 위쪽에 아래 한 줄을 1회만 넣어주세요.
  <script>window.HTU_CMS_ENDPOINT = 'https://관리자-배포-도메인';</script>
  내용 수정은 관리자 페이지(/admin)에서 하면 자동 반영됩니다.
-->
<section id="htuLayerPopup" aria-label="메인 팝업">
  <style>
    #htuLayerPopup { position: relative; z-index: 100000; font-family: 'Pretendard Variable', 'Pretendard', 'Noto Sans KR', sans-serif; }
    #htuLayerPopup * { box-sizing: border-box; }
    #htuLayerPopup .hlp-backdrop {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 20px; background: rgba(6, 18, 16, .45);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility .3s ease;
    }
    #htuLayerPopup.is-open .hlp-backdrop { opacity: 1; visibility: visible; }
    #htuLayerPopup .hlp-rail {
      display: flex; gap: 16px; max-width: 100%; overflow-x: auto; scroll-snap-type: x mandatory;
      scrollbar-width: none; padding: 4px;
    }
    #htuLayerPopup .hlp-rail::-webkit-scrollbar { display: none; }
    #htuLayerPopup .hlp-card {
      flex: 0 0 auto; width: min(400px, calc(100vw - 48px)); max-height: calc(100dvh - 48px);
      display: flex; flex-direction: column; overflow: hidden; scroll-snap-align: center;
      background: #fff; border-radius: 20px; box-shadow: 0 30px 90px rgba(0, 0, 0, .3);
      transform: translateY(14px); transition: transform .4s cubic-bezier(.22, 1, .36, 1);
    }
    #htuLayerPopup.is-open .hlp-card { transform: none; }
    #htuLayerPopup .hlp-media { display: block; background: #f2f4f2; }
    #htuLayerPopup .hlp-media img { display: block; width: 100%; height: auto; max-height: 60dvh; object-fit: contain; }
    #htuLayerPopup .hlp-body { padding: 20px 22px 18px; overflow-y: auto; }
    #htuLayerPopup .hlp-title { margin: 0 0 8px; font-size: 19px; font-weight: 900; letter-spacing: -.02em; color: #0b1220; }
    #htuLayerPopup .hlp-text { margin: 0; font-size: 14px; line-height: 1.7; color: rgba(11, 18, 32, .72); word-break: keep-all; }
    #htuLayerPopup .hlp-link {
      display: inline-flex; margin-top: 14px; padding: 10px 16px; border-radius: 999px; text-decoration: none;
      font-size: 13px; font-weight: 800; color: #fff; background: linear-gradient(135deg, #0a4f30, #0a6a62);
    }
    #htuLayerPopup .hlp-foot { display: flex; border-top: 1px solid rgba(15, 23, 42, .08); margin-top: auto; }
    #htuLayerPopup .hlp-foot button {
      flex: 1; height: 48px; border: 0; background: #fafbfa; cursor: pointer; font: inherit;
      font-size: 13.5px; font-weight: 700; color: rgba(11, 18, 32, .72);
    }
    #htuLayerPopup .hlp-foot button + button { border-left: 1px solid rgba(15, 23, 42, .08); color: #0b1220; }
    #htuLayerPopup .hlp-foot button:hover { background: #f0f3f1; }
  </style>
  <div class="hlp-backdrop"><div class="hlp-rail"></div></div>

  <script>
    (function () {
      var root = document.getElementById('htuLayerPopup');
      if (!root || root.__htuInit) return;
      root.__htuInit = true;

      function htuCms() {
        if (window.__HTU_CMS_DATA__) return Promise.resolve(window.__HTU_CMS_DATA__);
        if (!window.__htuCmsP) {
          var ep = String(window.HTU_CMS_ENDPOINT || '').replace(/\/+$/, '') + '/api/public/content';
          window.__htuCmsP = fetch(ep, { credentials: 'omit' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        }
        return window.__htuCmsP;
      }
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function today() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
      function hidden(id) { try { return localStorage.getItem('htu_popup_hide_' + id) === today(); } catch (e) { return false; } }
      function hideToday(id) { try { localStorage.setItem('htu_popup_hide_' + id, today()); } catch (e) {} }

      htuCms().then(function (data) {
        var now = Date.now();
        var list = ((data && data.popups) || []).filter(function (p) {
          if (p.starts_at && new Date(p.starts_at).getTime() > now) return false;
          if (p.ends_at && new Date(p.ends_at).getTime() < now) return false;
          return !hidden(p.id);
        });
        if (!list.length) return;

        var rail = root.querySelector('.hlp-rail');
        rail.innerHTML = list.map(function (p) {
          var target = p.link_new_tab ? ' target="_blank" rel="noopener noreferrer"' : '';
          var media = '';
          if (p.image_url) {
            var img = '<img src="' + esc(p.image_url) + '" alt="' + esc(p.title || '팝업 이미지') + '">';
            media = p.link_url ? '<a class="hlp-media" href="' + esc(p.link_url) + '"' + target + '>' + img + '</a>' : '<div class="hlp-media">' + img + '</div>';
          }
          var body = '';
          if (p.title || p.body_html || (p.link_url && !p.image_url)) {
            body = '<div class="hlp-body">' +
              (p.title ? '<h3 class="hlp-title">' + esc(p.title) + '</h3>' : '') +
              (p.body_html ? '<p class="hlp-text">' + p.body_html + '</p>' : '') +
              (p.link_url ? '<a class="hlp-link" href="' + esc(p.link_url) + '"' + target + '>' + esc(p.link_label || '자세히 보기') + '</a>' : '') +
              '</div>';
          }
          return '<div class="hlp-card" role="dialog" aria-label="' + esc(p.title || '공지 팝업') + '" data-id="' + esc(p.id) + '">' + media + body +
            '<div class="hlp-foot"><button type="button" data-act="today">오늘 하루 보지 않기</button><button type="button" data-act="close">닫기</button></div></div>';
        }).join('');

        function closeCard(card) {
          card.remove();
          if (!rail.children.length) root.classList.remove('is-open');
        }
        rail.addEventListener('click', function (e) {
          var btn = e.target.closest('button[data-act]');
          if (!btn) return;
          var card = btn.closest('.hlp-card');
          if (btn.getAttribute('data-act') === 'today') hideToday(card.getAttribute('data-id'));
          closeCard(card);
        });
        root.querySelector('.hlp-backdrop').addEventListener('click', function (e) {
          if (e.target === e.currentTarget) root.classList.remove('is-open');
        });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') root.classList.remove('is-open'); });
        setTimeout(function () { root.classList.add('is-open'); }, 400);
      });
    })();
  </script>
</section>
